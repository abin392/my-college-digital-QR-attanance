<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/ksk logo.jpeg" type="image/x-icon">
    <title>Professor Portal - Admin</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- jsPDF for true PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- NEW: Leaflet Map Library for Location UI -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- FIREBASE SETUP via ES Modules -->
    <script type="module" src="firebaseconfig.js"></script>

    <style>
        .btn-disabled { opacity: 0.7; cursor: not-allowed !important; }
        :root {
            --primary-red: #bb0f1c;
            --primary-red-hover: #9b0c16;
            --sidebar-width: 260px;
            --bg-color: #f4f7fb;
            --white: #ffffff;
            --text-dark: #0f172a;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.08);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background: linear-gradient(135deg, #fdfdfe 0%, #edf2f8 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Layout */
        .sidebar { width: var(--sidebar-width); background-color: var(--white); border-right: 1px solid var(--border-light); display: flex; flex-direction: column; padding: 32px 0; position: fixed; height: 100vh; z-index: 100; }
        .sidebar-header { padding: 0 24px; margin-bottom: 40px; }
        .sidebar-header h1 { font-size: 1.5rem; font-weight: 800; color: var(--text-dark); line-height: 1.2; margin-bottom: 4px; }
        .sidebar-header p { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 0 16px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-decoration: none; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; border-radius: 8px; transition: all 0.2s ease; border-left: 3px solid transparent; }
        .nav-item i { font-size: 1.1rem; width: 20px; text-align: center; }
        .nav-item:hover { background-color: #f8fafc; color: var(--text-dark); }
        .nav-item.active { background-color: #fff1f2; color: var(--primary-red); border-left-color: var(--primary-red); }

        .sidebar-footer { padding: 0 24px; display: flex; flex-direction: column; gap: 16px; }
        .btn-start-class { background-color: var(--primary-red); color: var(--white); border: none; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; width: 100%; }
        .btn-start-class:hover { background-color: var(--primary-red-hover); }
        .footer-link { display: flex; align-items: center; gap: 12px; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
        .footer-link:hover { color: var(--text-dark); }

        /* Main Content Layout */
        .main-content { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Top Header */
        .top-header { height: 70px; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; background-color: transparent; }
        .header-links { display: flex; gap: 24px; }
        .header-links a { text-decoration: none; color: var(--text-muted); font-size: 0.85rem; font-weight: 500; }
        .header-links a:hover { color: var(--text-dark); }
        
        .header-actions { display: flex; align-items: center; gap: 20px; margin-left: auto; }
        .header-icon { color: var(--text-muted); font-size: 1.1rem; cursor: pointer; }
        .btn-new-session { background-color: var(--primary-red); color: var(--white); border: none; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .profile-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--white); box-shadow: var(--shadow-sm); cursor: pointer; transition: border-color 0.2s; }
        .profile-img:hover { border-color: var(--primary-red); }

        /* Profile Dropdown Styles */
        .profile-dropdown { position: relative; display: flex; align-items: center; }
        .dropdown-content { display: none; position: absolute; right: 0; top: 120%; background-color: var(--white); min-width: 220px; box-shadow: var(--shadow-md); border-radius: 10px; padding: 16px; z-index: 1000; text-align: center; border: 1px solid var(--border-light); }
        .dropdown-content.show { display: block; }
        .dropdown-profile-img { width: 56px; height: 56px; border-radius: 50%; margin-bottom: 12px; object-fit: cover; }
        .dropdown-email { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; word-break: break-all; }
        .logout-btn { background-color: #fef2f2; color: var(--primary-red); border: 1px solid #fecaca; padding: 10px 16px; border-radius: 6px; width: 100%; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
        .logout-btn:hover { background-color: var(--primary-red); color: var(--white); }

        /* Page Content */
        .page-content { padding: 20px 40px 40px; }
        .page-header { margin-bottom: 32px; }
        .page-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); margin-bottom: 8px; letter-spacing: -0.5px; }
        .page-subtitle { color: var(--text-muted); font-size: 1rem; }

        /* Split Layout (Updated for 3 Columns) */
        .grid-layout { display: grid; grid-template-columns: 1fr 1.1fr 0.9fr; gap: 24px; align-items: stretch; }
        
        /* NEW: History Card Styles */
        .history-card { background: var(--white); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 16px; max-height: 620px; overflow-y: auto; }
        .history-title { font-size: 1.1rem; font-weight: 700; color: var(--text-dark); border-bottom: 1px solid var(--border-light); padding-bottom: 12px; margin-bottom: 8px; position: sticky; top: -24px; background: var(--white); z-index: 10; margin-top: -8px; padding-top: 8px; }
        .history-item { background: #f8fafc; border: 1px solid var(--border-light); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: transform 0.2s, box-shadow 0.2s; }
        .history-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
        .hist-course { font-size: 0.95rem; font-weight: 700; color: var(--text-dark); margin-bottom: 2px; }
        .hist-dept { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
        .hist-date { font-size: 0.75rem; color: #94a3b8; }
        .hist-actions { display: flex; gap: 8px; margin-top: auto; }
        .btn-hist-action { flex: 1; padding: 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s; background: var(--white); border: 1px solid var(--border-light); color: var(--text-main); }
        .btn-hist-action:hover { background: #f1f5f9; color: var(--primary-red); border-color: #cbd5e1; }
        
        /* Custom Scrollbar for History */
        .history-card::-webkit-scrollbar { width: 6px; }
        .history-card::-webkit-scrollbar-track { background: transparent; }
        .history-card::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* Left Column: Form Card */
        .form-card { background: var(--white); border-radius: 16px; padding: 32px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 24px; }
        .form-section-title { font-size: 1.1rem; font-weight: 700; color: var(--text-dark); border-bottom: 1px solid var(--border-light); padding-bottom: 12px; margin-bottom: 8px; }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-dark); }
        
        /* Custom Select & Input */
        .custom-input { background-color: #f1f5f9; border: 1px solid transparent; border-radius: 8px; padding: 12px 16px; font-size: 0.95rem; font-family: inherit; color: var(--text-dark); width: 100%; transition: all 0.2s; outline: none; appearance: none; }
        .custom-input:focus { background-color: var(--white); border-color: #cbd5e1; box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.05); }
        .select-wrapper { position: relative; }
        .select-wrapper::after { content: '\f078'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; color: var(--text-muted); pointer-events: none; }
        
        .btn-generate { background-color: #0f172a; color: var(--white); border: none; padding: 14px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: auto; }
        .btn-generate:hover { background-color: #1e293b; }

        /* Right Column: QR Preview Card */
        .qr-preview-container { background-color: var(--white); border-radius: 16px; padding: 40px; display: flex; justify-content: center; align-items: center; box-shadow: var(--shadow-md); position: relative; overflow: hidden; min-height: 500px; }
        
        /* Grid Background Pattern */
        .qr-preview-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(to right, #f1f5f9 1px, transparent 1px), linear-gradient(to bottom, #f1f5f9 1px, transparent 1px); background-size: 40px 40px; z-index: 1; }
        
        .qr-card-inner { background: var(--white); border-radius: 16px; padding: 40px 32px; box-shadow: var(--shadow-lg); z-index: 2; text-align: center; width: 340px; display: flex; flex-direction: column; align-items: center; }
        .qr-image { width: 180px; height: 180px; margin-bottom: 32px; object-fit: contain; }
        
        .qr-course-title { font-size: 1.1rem; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
        .qr-meta-text { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; }
        
        .qr-actions { display: flex; gap: 12px; width: 100%; }
        .btn-action { flex: 1; padding: 10px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s; }
        .btn-download { background: transparent; border: 1px solid var(--border-light); color: var(--text-dark); }
        .btn-download:hover { background: #f8fafc; }
        .btn-print { background: var(--primary-red); border: 1px solid var(--primary-red); color: var(--white); }
        .btn-print:hover { background: var(--primary-red-hover); }

        /* Sidebar Mobile Overlay */
        .mobile-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.4); z-index: 90; opacity: 0; transition: opacity 0.3s ease; backdrop-filter: blur(2px); }
        .mobile-overlay.show { display: block; opacity: 1; }
        
        /* Mobile Menu Button */
        .menu-toggle-btn { display: none; background: transparent; border: none; font-size: 1.4rem; color: var(--text-dark); cursor: pointer; margin-right: 16px; padding: 4px; transition: color 0.2s; }
        .menu-toggle-btn:hover { color: var(--primary-red); }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .grid-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
            .timetable-grid { grid-template-columns: 280px minmax(0, 1fr); }
            .history-card { grid-column: span 2; }
        }
        @media (max-width: 1024px) {
            .timetable-grid { grid-template-columns: minmax(0, 1fr); }
            .history-card { grid-column: span 1; }
        }
        @media (max-width: 900px) {
            .grid-layout { grid-template-columns: minmax(0, 1fr); }
            .history-card { grid-column: span 1; }
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: var(--shadow-lg); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; width: 100vw; overflow-x: hidden; }
            .top-header { padding: 0 16px; justify-content: space-between; }
            .header-left { display: flex; align-items: center; }
            .page-content { padding: 16px; width: 100%; overflow-x: hidden; }
            .header-links { display: none; }
            .menu-toggle-btn { display: block; margin-right: 12px; }
            
            /* Prevent crowding on small screens */
            .header-actions .fa-circle-question { display: none; }
            .btn-new-session { padding: 6px 12px; font-size: 0.75rem; }

            /* --- STRICT MOBILE UI FIXES --- */
            .page-title { font-size: 1.6rem; text-align: left; }
            .page-subtitle { text-align: left; font-size: 0.9rem; }
            
            /* Force dual inputs to stack vertically */
            .input-row { display: flex !important; flex-direction: column !important; gap: 16px !important; } 
            
            /* Reduce paddings to fit narrow screens */
            .form-card, .context-panel, .schedule-entry-card, .timeline-preview-card, .history-card { padding: 16px !important; }
            
            /* Timetable UI Fixes */
            .timetable-header-row { display: flex !important; flex-direction: column !important; align-items: flex-start !important; gap: 16px !important; margin-bottom: 24px !important; width: 100%; }
            .timetable-header-row .page-header { width: 100%; text-align: left; }
            .timetable-actions { width: 100% !important; display: flex !important; flex-direction: row !important; gap: 12px !important; }
            .btn-cancel, .btn-save { flex: 1 !important; justify-content: center !important; text-align: center !important; padding: 12px !important; font-size: 0.9rem; }
            
            /* Schedule Entry Tab scrolling */
            .schedule-entry-header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .day-tabs { margin-left: 0; width: 100%; overflow-x: auto; padding-bottom: 8px; }
            
            /* QR Generator Mobile Fixes */
            .qr-preview-container { padding: 16px; min-height: auto; }
            .qr-card-inner { width: 100%; padding: 24px 16px; }
            .qr-image { width: 150px; height: 150px; }
            
            .qr-actions { display: flex !important; flex-direction: column !important; gap: 10px !important; width: 100%; }
            .btn-action { padding: 12px; width: 100%; }
            .hist-actions { display: flex !important; flex-direction: column !important; gap: 8px; }
        }
        
        /* Timetable Empty State */
        .empty-schedule-state { background: var(--white); border-radius: 16px; padding: 60px 20px; text-align: center; border: 2px dashed #cbd5e1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 400px; color: var(--text-muted); }
        .empty-schedule-state i { font-size: 3.5rem; color: #cbd5e1; margin-bottom: 16px; }
        .empty-schedule-state h4 { font-size: 1.25rem; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }
        .empty-schedule-state p { font-size: 0.95rem; max-width: 350px; line-height: 1.5; }

        /* NEW: Map Modal Overlay Styles */
        .map-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); z-index: 9999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(4px); opacity: 0; animation: fadeIn 0.2s forwards; }
        .map-modal { background: var(--white); border-radius: 16px; padding: 32px; width: 90%; max-width: 600px; box-shadow: var(--shadow-lg); transform: scale(0.95); animation: scaleUp 0.2s forwards; display: flex; flex-direction: column; }
        .map-modal h3 { font-size: 1.25rem; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
        .map-modal p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; }
        .map-error-msg { background: #fff1f2; color: var(--primary-red); padding: 12px 16px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; border: 1px solid #fecaca; font-weight: 500; }
        #leaflet-map-container { height: 320px; width: 100%; border-radius: 12px; margin-bottom: 24px; border: 1px solid var(--border-light); z-index: 1; }
        .map-modal-actions { display: flex; justify-content: flex-end; gap: 12px; }
        
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes scaleUp { to { transform: scale(1); } }

        /* NEW: Class Management / Timetable Styles */
        .timetable-header-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
        .timetable-actions { display: flex; gap: 12px; }
        .btn-cancel { background: transparent; border: 1px solid var(--border-light); padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--text-main); transition: background 0.2s; }
        .btn-cancel:hover { background: #f8fafc; }
        .btn-save { background: var(--primary-red); color: var(--white); border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s; }
        .btn-save:hover { background: var(--primary-red-hover); }
        .timetable-grid { display: grid; grid-template-columns: 260px minmax(0, 1fr) 280px; gap: 24px; align-items: start; }
        
        /* Timetable Context Panel */
        .context-panel { background: #f8fafc; border-radius: 16px; padding: 24px; border: 1px solid var(--border-light); }
        .panel-title { font-size: 1.1rem; font-weight: 700; color: var(--text-dark); margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .template-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
        .template-card { background: var(--white); border: 1px solid var(--border-light); border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .template-card:hover { border-color: var(--primary-red); color: var(--primary-red); box-shadow: var(--shadow-sm); }
        .template-card i { font-size: 1.5rem; margin-bottom: 8px; color: var(--text-muted); transition: color 0.2s; }
        .template-card:hover i { color: var(--primary-red); }
        
        /* Timetable Schedule Entry */
        .schedule-panel { display: flex; flex-direction: column; gap: 24px; }
        .schedule-entry-card { background: var(--white); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); overflow: hidden; }
        .schedule-entry-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; border-bottom: 1px solid var(--border-light); padding-bottom: 16px; flex-wrap: wrap; }
        .day-tabs { display: flex; gap: 8px; margin-left: auto; overflow-x: auto; }
        .day-tab { padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--text-muted); transition: all 0.2s; white-space: nowrap; }
        .day-tab.active { background: #ffeef0; color: var(--primary-red); }
        .table-responsive-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
        .schedule-table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .schedule-table th { text-align: left; padding: 0 12px 12px; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        .schedule-table td { padding: 8px; }
        .schedule-table input { width: 100%; padding: 10px 12px; border: 1px solid var(--border-light); border-radius: 8px; font-family: inherit; font-size: 0.9rem; color: var(--text-dark); transition: border-color 0.2s; outline: none; }
        .schedule-table input:focus { border-color: var(--primary-red); }
        .btn-delete-row { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; padding: 8px; transition: color 0.2s; width: 100%; }
        .btn-delete-row:hover { color: var(--primary-red); }
        .btn-add-row { background: #0f172a; color: var(--white); border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; margin: 0 auto; transition: background 0.2s; }
        .btn-add-row:hover { background: var(--primary-red); }
        
        /* Timetable Preview */
        .timeline-preview-card { background: var(--white); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); }
        .timeline-title { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 16px; letter-spacing: 0.5px; }
        .timeline-track { display: flex; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; background: #f8fafc; height: 80px; }
        .timeline-block { border-right: 1px solid #e2e8f0; padding: 12px; display: flex; flex-direction: column; justify-content: center; transition: background 0.2s; }
        .timeline-block.filled-1 { background: #eff6ff; border-left: 3px solid #3b82f6; }
        .timeline-block.filled-2 { background: #f5f3ff; border-left: 3px solid #8b5cf6; }
        .timeline-block h5 { font-size: 0.85rem; color: var(--text-dark); margin-bottom: 4px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .timeline-block p { font-size: 0.75rem; color: var(--text-muted); }

        @media (max-width: 1024px) {
            .timetable-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="react-admin-root"></div>

    <script type="text/babel">
        function AdminDashboard() {
            // Navigation State (SPA Routing)
            const [activeView, setActiveView] = React.useState('qr_generator');

            // Security State for Admin Access
            const [isAuthorized, setIsAuthorized] = React.useState(false);
            
            // Sidebar Mobile Toggle State
            const [isSidebarOpen, setIsSidebarOpen] = React.useState(false);
            
            // Profile Dropdown State & User Data
            const [isDropdownOpen, setIsDropdownOpen] = React.useState(false);
            const [adminProfile, setAdminProfile] = React.useState({ name: 'Admin', email: '', photoUrl: '' });
            
            // State for dynamic QR Card updates
            const [formData, setFormData] = React.useState({
                department: 'Computer Science',
                year: '2-year',
                semester: 'sem-3',
                course: 'GE3791- Human Values And Ethics',
                room: 'CR-200',
                expiration: '15',
                latitude: '',
                longitude: ''
            });

            // Map UI States
            const [isMapModalOpen, setIsMapModalOpen] = React.useState(false);
            const [mapError, setMapError] = React.useState('');
            const mapRef = React.useRef(null);
            const markerRef = React.useRef(null);

            // State for actual Generated QR code URL (Starts as null to show Empty State)
            const [qrUrl, setQrUrl] = React.useState(null);
            const [highResQrUrl, setHighResQrUrl] = React.useState(null);

            // Loading UX States
            const [isGenerating, setIsGenerating] = React.useState(false);
            const [isDownloading, setIsDownloading] = React.useState(false);
            const [isPrinting, setIsPrinting] = React.useState(false);

            // NEW: QR Code History State
            const [qrHistory, setQrHistory] = React.useState([]);

            // Load history from LocalStorage on mount
            React.useEffect(() => {
                const savedHistory = localStorage.getItem('kskcet_qr_history');
                if (savedHistory) {
                    setQrHistory(JSON.parse(savedHistory));
                }
            }, []);

            // NEW: Timetable Context State & Validation Logic
            const [timetableContext, setTimetableContext] = React.useState({
                program: '',
                year: '',
                semester: '',
                batch: '',
                startDate: '',
                endDate: ''
            });

            // NEW: Timetable Schedule State
            const [activeDay, setActiveDay] = React.useState('Monday');
            const [scheduleData, setScheduleData] = React.useState({
                Monday: [],
                Tuesday: [],
                Wednesday: [],
                Thursday: [],
                Friday: []
            });
            const [isSavingTimetable, setIsSavingTimetable] = React.useState(false);

            // NEW: Fetched Timetable List State from Firebase
            const [timetableList, setTimetableList] = React.useState([]);
            const [isLoadingTimetables, setIsLoadingTimetables] = React.useState(false);
            const [fetchError, setFetchError] = React.useState('');

            // Fetch stored timetables when the view opens
            React.useEffect(() => {
                if (activeView === 'class_management' && window.firebaseAuth && window.firebaseAuth.db) {
                    const fetchTimetables = async () => {
                        setIsLoadingTimetables(true);
                        setFetchError('');
                        try {
                            // 1. Support for Standard Modular V9
                            if (window.firebaseAuth.collection && window.firebaseAuth.getDocs) {
                                const collRef = window.firebaseAuth.collection(window.firebaseAuth.db, "timetables");
                                const snapshot = await window.firebaseAuth.getDocs(collRef);
                                const list = [];
                                snapshot.forEach(doc => {
                                    list.push({ id: doc.id, ...doc.data() });
                                });
                                list.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
                                setTimetableList(list);
                            } 
                            // 2. Support for Compat V8 (Fallback)
                            else if (typeof window.firebaseAuth.db.collection === 'function') {
                                const snapshot = await window.firebaseAuth.db.collection("timetables").get();
                                const list = [];
                                snapshot.forEach(doc => {
                                    list.push({ id: doc.id, ...doc.data() });
                                });
                                list.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
                                setTimetableList(list);
                            } 
                            // 3. Catch Missing config exports cleanly
                            else {
                                setFetchError('missing_exports');
                            }
                        } catch (err) {
                            console.error("Error fetching timetables from Firebase:", err);
                            setFetchError('permission_error');
                        } finally {
                            setIsLoadingTimetables(false);
                        }
                    };
                    fetchTimetables();
                }
            }, [activeView]);

            const handleTimetableChange = (e) => {
                setTimetableContext({ ...timetableContext, [e.target.name]: e.target.value });
            };

            const isContextFilled = () => {
                return timetableContext.program !== '' && 
                       timetableContext.year !== '' && 
                       timetableContext.semester !== '' && 
                       timetableContext.batch !== '' && 
                       timetableContext.startDate !== '' && 
                       timetableContext.endDate !== '';
            };

            // NEW: Schedule Data Handlers
            const handleAddRow = () => {
                setScheduleData(prev => ({
                    ...prev,
                    [activeDay]: [...prev[activeDay], { startTime: '', endTime: '', subject: '', faculty: '', room: '' }]
                }));
            };

            const handleRemoveRow = (index) => {
                setScheduleData(prev => ({
                    ...prev,
                    [activeDay]: prev[activeDay].filter((_, i) => i !== index)
                }));
            };

            // NEW: Instantly load Firebase data into the Form UI
            const handleLoadTimetable = (item) => {
                setTimetableContext(item.context);
                setScheduleData(item.schedule);
                setActiveDay('Monday'); // Reset to Monday view on load
            };

            // NEW: Delete Timetable securely from Firebase & UI
            const handleDeleteTimetable = async (e, id) => {
                e.stopPropagation(); // Prevents the row click from accidentally loading the timetable
                
                const confirmDelete = window.confirm("WARNING: This action will completely erase this timetable data from the database. This action cannot be undone. Do you wish to proceed?");
                
                if (confirmDelete) {
                    try {
                        // Support for Standard V9
                        if (window.firebaseAuth.deleteDoc && window.firebaseAuth.doc) {
                            await window.firebaseAuth.deleteDoc(window.firebaseAuth.doc(window.firebaseAuth.db, "timetables", id));
                        } 
                        // Support for Compat V8
                        else if (typeof window.firebaseAuth.db.collection === 'function') {
                            await window.firebaseAuth.db.collection("timetables").doc(id).delete();
                        } 
                        // Failsafe Warning
                        else {
                            alert("Setup Required: Please add 'deleteDoc' to your firebaseconfig.js exports to enable deletion.");
                            return;
                        }
                        
                        // Instantly update the UI list
                        setTimetableList(prev => prev.filter(t => t.id !== id));
                    } catch (error) {
                        console.error("Error deleting timetable:", error);
                        alert("Failed to delete timetable. Ensure you have Admin permissions.");
                    }
                }
            };

            const handleScheduleChange = (index, field, value) => {
                setScheduleData(prev => {
                    const newDayData = [...prev[activeDay]];
                    newDayData[index][field] = value;
                    return { ...prev, [activeDay]: newDayData };
                });
            };

            // NEW: Secure Firebase Save Handler
            const handleSaveTimetable = async () => {
                if (!isContextFilled()) {
                    alert("Please fill all context details before saving.");
                    return;
                }
                setIsSavingTimetable(true);
                try {
                    // Create a unique document ID based on Context details
                    const docId = `${timetableContext.program}_${timetableContext.year}_${timetableContext.semester}_${timetableContext.batch}`.replace(/[^a-zA-Z0-9]/g, '_');
                    
                    const newTimetable = {
                        context: timetableContext,
                        schedule: scheduleData,
                        updatedAt: new Date().toISOString(),
                        createdBy: adminProfile.email
                    };

                    await window.firebaseAuth.setDoc(
                        window.firebaseAuth.doc(window.firebaseAuth.db, "timetables", docId),
                        newTimetable

                    // Optimistically update the UI list so you see it instantly
                    setTimetableList(prev => {
                        const filtered = prev.filter(t => t.id !== docId);
                        return [{ id: docId, ...newTimetable }, ...filtered];
                    });

                    alert("Timetable saved successfully to Firebase!");
                } catch (err) {
                    console.error(err);
                    alert("Failed to save timetable. Check console for details: " + err.message);
                } finally {
                    setIsSavingTimetable(false);

                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;
                            setFormData(prev => ({ ...prev, latitude: lat, longitude: lng }));
                            
                            if (mapRef.current) {
                                mapRef.current.setView([lat, lng], 17);
                                if (markerRef.current) {
                                    markerRef.current.setLatLng([lat, lng]);
                                } else {
                                    markerRef.current = window.L.marker([lat, lng]).addTo(mapRef.current);
                                }
                            }
                        },
                        (error) => {
                            setMapError("Location permission denied. Please allow GPS access in your browser settings.");
                        },
                        { enableHighAccuracy: true } // Forces highly accurate GPS reading
                    );
                } else {
                    setMapError("Geolocation is not supported by your browser.");
                }
            }, []);

                            const map = window.L.map('leaflet-map-container').setView([20.5937, 78.9629], 5);
                            window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                                attribution: '© OpenStreetMap'
                            }).addTo(map);
                            mapRef.current = map;

                            handleDetectLocation();
                        }

                } else {
                    // Cleanup map instance when modal closes
                    if (mapRef.current) {
                        mapRef.current.remove();
                        mapRef.current = null;
                        markerRef.current = null;

            const executeDownload = async (dataPayload, url, loaderSetter) => {
                if(loaderSetter) loaderSetter(true);
                try {
                    const response = await fetch(url);
                    const blob = await response.blob();
                    const imgUrl = window.URL.createObjectURL(blob);
                    
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(22);
                    doc.setTextColor(187, 15, 28);
                    doc.text("KSK College of Engineering & Technology", 105, 30, { align: "center" });
                    
                    doc.setFontSize(18);
                    doc.setTextColor(15, 23, 42);
                    doc.text(dataPayload.department, 105, 45, { align: "center" });
                    
                    doc.addImage(imgUrl, 'PNG', 45, 60, 120, 120);
                    
                    doc.setFontSize(16);
                    doc.text(dataPayload.course, 105, 200, { align: "center" });
                    
                    doc.setFontSize(12);
                    doc.setTextColor(100, 116, 139);
                    doc.setFont("helvetica", "normal");

                } catch (error) {
                    console.error("Download failed", error);
                    window.open(url, '_blank');

                    if(loaderSetter) loaderSetter(false);
                }

                        <head>

                                body { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Inter', sans-serif; text-align: center; color: #0f172a; -webkit-print-color-adjust: exact; }
                                .qr-image { width: 500px; height: 500px; margin: 40px 0; }
                                h1 { font-size: 2.5rem; margin-bottom: 10px; color: #bb0f1c; }
                                h2 { font-size: 2rem; margin-bottom: 5px; }
                                p { font-size: 1.5rem; color: #64748b; }
                            </style>
                        </head>
                        <body>
                            <h1>KSK College of Engineering & Technology</h1>
                            <h2>${dataPayload.department}</h2>
                            <img src="${url}" class="qr-image" onload="window.print(); window.close();" />
                            <h2>${dataPayload.course}</h2>
                            <p>${dataPayload.room} &bull; Valid for ${dataPayload.expiration} mins</p>
                        </body>
                        </html>
                    `);
                    printWindow.document.close();
                    if(loaderSetter) loaderSetter(false);
                }, 600);
            };

            // Handle Generate Code Button
            const handleGenerateCode = () => {
                setIsGenerating(true);
                setTimeout(() => {
                    const qrPayload = JSON.stringify(formData);
                    const encodedPayload = encodeURIComponent(qrPayload);
                    
                    const newQrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodedPayload}`;
                    const newHighResUrl = `https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&data=${encodedPayload}`;
                    
                    setQrUrl(newQrUrl);
                    setHighResQrUrl(newHighResUrl);
                    
                    // Add to History & LocalStorage
                    const newItem = {
                        id: Date.now(),
                        ...formData,
                        highResQrUrl: newHighResUrl,
                        timestamp: new Date().toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })
                    };
                    
                    // Update state & cap history list at 50 items
                    const updatedHistory = [newItem, ...qrHistory].slice(0, 50); 
                    setQrHistory(updatedHistory);
                    localStorage.setItem('kskcet_qr_history', JSON.stringify(updatedHistory));
                    
                    setIsGenerating(false);
                }, 800);
            };

            // NEW: Handle Deleting an item from History and LocalStorage
            const handleRemoveHistoryItem = (id) => {
                const updatedHistory = qrHistory.filter(item => item.id !== id);
                setQrHistory(updatedHistory);
                localStorage.setItem('kskcet_qr_history', JSON.stringify(updatedHistory));
            };

            // Wire up handlers for Active Code
            const handleDownload = () => executeDownload(formData, highResQrUrl, setIsDownloading);
            const handlePrint = () => executePrint(formData, highResQrUrl, setIsPrinting);
            
            // Wire up handlers for History List items
            const handleHistoryDownload = (item) => executeDownload(item, item.highResQrUrl, null);
            const handleHistoryPrint = (item) => executePrint(item, item.highResQrUrl, null);

            // --- ADMIN SECURITY CHECK ---
            React.useEffect(() => {
                let unsubscribe = null;
                
                // Wait for Firebase to attach to the window, then check status
                const checkAuth = () => {
                    if (window.firebaseAuth && window.firebaseAuth.onAuthStateChanged) {
                        unsubscribe = window.firebaseAuth.onAuthStateChanged(window.firebaseAuth.auth, (user) => {
                            if (user && user.email === 'kskcet774@gmail.com') {
                                setIsAuthorized(true); // Email matches, render the page
                                
                                // Fetch Admin Profile Data
                                const photoUrl = user.photoURL || `https://ui-avatars.com/api/?name=${user.email}&background=0f172a&color=fff`;
                                const displayName = user.displayName || user.email.split('@')[0];
                                setAdminProfile({ name: displayName, email: user.email, photoUrl: photoUrl });
                            } else {
                                // Block access & kick back to Dashboard
                                alert("Admin Access Denied. Redirecting to Student Dashboard.");
                                window.location.href = 'index.html';
                            }

                    } else {
                        // Retry check if firebase script hasn't loaded yet
                        setTimeout(checkAuth, 100);
                    }
                };
                checkAuth();

                // Close dropdown when clicking anywhere else on the screen
                const closeDropdown = (e) => {
                    if (!e.target.closest('.profile-dropdown')) {
                        setIsDropdownOpen(false);
                    }
                };
                window.addEventListener('click', closeDropdown);

                return () => {
                    if (unsubscribe) unsubscribe();
                    window.removeEventListener('click', closeDropdown);
                };
            }, []);

                e.preventDefault();
                if (window.firebaseAuth && window.firebaseAuth.signOut) {

                        <nav className="sidebar-nav">

                                <i className="fa-solid fa-border-all"></i> Dashboard
                            </a>
                            <a 
                                href="#" 
                                className={`nav-item ${activeView === 'class_management' ? 'active' : ''}`} 
                                onClick={(e) => { e.preventDefault(); setActiveView('class_management'); setIsSidebarOpen(false); }}
                            >
                                <i className="fa-regular fa-calendar"></i> Class Management
                            </a>

                                    title="Open Menu"

                                    <i className="fa-solid fa-bars"></i>

                                    <a href="#">Schedule</a>
                                    <a href="#">Reports</a>
                                </div>

                                <i className="fa-regular fa-circle-question header-icon"></i>

                                    <div className={`dropdown-content ${isDropdownOpen ? 'show' : ''}`}>

                                        <p className="dropdown-email">{adminProfile.email}</p>

                        {activeView === 'qr_generator' && (

                                    <div className="form-group">

                                        <div className="select-wrapper">

                                                <option>Computer Science</option>

                                                <option>Mechanical Engineering</option>
                                                <option>Electrical Engineering</option>

                                    <div className="input-row">
                                        <div className="form-group">
                                            <label>Year</label>
                                            <div className="select-wrapper">
                                                <select name="year" value={formData.year} onChange={handleChange} className="custom-input">
                                                    <option>1-year</option>
                                                    <option>2-year</option>
                                                    <option>3-year</option>
                                                    <option>4-year</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div className="form-group">
                                            <label>Semester</label>
                                            <div className="select-wrapper">
                                                <select name="semester" value={formData.semester} onChange={handleChange} className="custom-input">
                                                    <option>sem-1</option>
                                                    <option>sem-2</option>
                                                    <option>sem-3</option>
                                                    <option>sem-4</option>
                                                    <option>sem-5</option>
                                                    <option>sem-6</option>
                                                    <option>sem-7</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="form-group">
                                        <label>Subject / Course</label>
                                        <div className="select-wrapper">
                                            <select name="course" value={formData.course} onChange={handleChange} className="custom-input">
                                                <option>GE3791- Human Values And Ethics</option>
                                                <option>CME365- Renewable Energy Technologies</option>
                                                <option>GE3751- Principles of Management</option>
                                                <option>OHS352- Project Report Writing</option>
                                                <option>NM112- TN-skill</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="form-group">
                                        <label>Room / Location</label>
                                        <div className="select-wrapper">
                                            <select name="room" value={formData.room} onChange={handleChange} className="custom-input">
                                                <option>CR-200</option>
                                                <option>CR-201</option>
                                                <option>CR-202</option>
                                                <option>CR-203</option>
                                            </select>

                                    <div className="form-group">

                                    <div className="form-group">

                                        <div style={{ position: 'relative' }} onClick={() => setIsMapModalOpen(true)}>
                                            <i className="fa-solid fa-map-location-dot" style={{ position: 'absolute', left: '16px', top: '50%', transform: 'translateY(-50%)', color: 'var(--primary-red)', zIndex: 10, fontSize: '1.1rem' }}></i>
                                            <input 
                                                type="text" 
                                                readOnly 
                                                value={formData.latitude ? `${formData.latitude.toFixed(5)}, ${formData.longitude.toFixed(5)}` : 'Click to allow & fetch location'} 
                                                className="custom-input" 
                                                style={{ cursor: 'pointer', paddingLeft: '44px', color: formData.latitude ? 'var(--text-dark)' : 'var(--primary-red)', fontWeight: formData.latitude ? '600' : '500' }}
                                                placeholder="Fetch GPS Coordinates"

                                    <button className={`btn-generate ${isGenerating ? 'btn-disabled' : ''}`} onClick={handleGenerateCode} disabled={isGenerating}>
                                        {isGenerating ? <><i className="fa-solid fa-spinner fa-spin"></i> Generating...</> : "Generate Code"}
                                    </button>

                                        {!qrUrl ? (
