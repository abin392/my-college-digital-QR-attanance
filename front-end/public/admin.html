                                                <i className="fa-solid fa-qrcode" style={{ fontSize: '4.5rem', opacity: '0.15', marginBottom: '24px' }}></i>
                                                <h4 style={{ fontSize: '1.15rem', fontWeight: '700', color: 'var(--text-dark)', marginBottom: '8px' }}>No Code Generated</h4>
                                                <p style={{ fontSize: '0.9rem', lineHeight: '1.5' }}>Fill in the session details on the left and click generate to create a new attendance QR code.</p>
                                            </div>
                                        ) : (
                                            // Active QR Code UI
                                            <>
                                                {/* Generated QR Code Image */}
                                                <img src={qrUrl} alt="QR Code" className="qr-image" />
                                                
                                                {/* Dynamic Text reflecting Form State */}
                                                <h4 className="qr-course-title">{formData.course}</h4>
                                                <p className="qr-meta-text">{formData.room} &bull; Valid for {formData.expiration} mins</p>
                                                
                                                <div className="qr-actions">
                                                    <button className={`btn-action btn-download ${isDownloading ? 'btn-disabled' : ''}`} onClick={handleDownload} disabled={isDownloading}>
                                                        {isDownloading ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-file-pdf"></i>} 
                                                        {isDownloading ? "Downloading..." : "Download PDF"}
                                                    </button>
                                                    <button className={`btn-action btn-print ${isPrinting ? 'btn-disabled' : ''}`} onClick={handlePrint} disabled={isPrinting}>
                                                        {isPrinting ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-print"></i>} 
                                                        {isPrinting ? "Printing..." : "Print PDF"}
                                                    </button>
                                                </div>
                                            </>
                                        )}
                                        
                                    </div>
                                </div>

                                {/* NEW: Generated QR Code History List (Right Column) */}
                                <div className="history-card">
                                    <h3 className="history-title"><i className="fa-solid fa-clock-rotate-left"></i> Previous Codes</h3>
                                    
                                    {qrHistory.length === 0 ? (
                                        <p style={{color: 'var(--text-muted)', fontSize: '0.9rem', textAlign: 'center', marginTop: '30px'}}>
                                            No codes generated yet.
                                        </p>
                                    ) : (
                                        qrHistory.map(item => (
                                            <div key={item.id} className="history-item" style={{ position: 'relative' }}>
                                                {/* NEW: Remove Icon Button */}
                                                <button 
                                                    onClick={() => handleRemoveHistoryItem(item.id)} 
                                                    title="Remove from history"
                                                    style={{ position: 'absolute', top: '12px', right: '12px', background: 'none', border: 'none', color: '#94a3b8', cursor: 'pointer', fontSize: '0.9rem', transition: 'color 0.2s' }}
                                                    onMouseOver={(e) => e.target.style.color = 'var(--primary-red)'}
                                                    onMouseOut={(e) => e.target.style.color = '#94a3b8'}
                                                >
                                                    <i className="fa-solid fa-trash-can"></i>
                                                </button>

                                                <div style={{ paddingRight: '20px' }}>
                                                    <h4 className="hist-course">{item.course}</h4>
                                                    <p className="hist-dept">{item.department}</p>
                                                    <p className="hist-date"><i className="fa-regular fa-clock"></i> {item.timestamp} &bull; {item.expiration} mins</p>
                                                </div>
                                                <div className="hist-actions">
                                                    <button className="btn-hist-action" onClick={() => handleHistoryDownload(item)} title="Download PDF">
                                                        <i className="fa-solid fa-download"></i> Download
                                                    </button>
                                                    <button className="btn-hist-action" onClick={() => handleHistoryPrint(item)} title="Print PDF">
                                                        <i className="fa-solid fa-print"></i> Print
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                            </div>
                        </div>
                        )}

                        {/* NEW: Class Management View (Add Timetable) */}
                        {activeView === 'class_management' && (
                            <div className="page-content">
                                <div className="timetable-header-row">
                                    <div className="page-header" style={{ marginBottom: 0 }}>
                                        <h2 className="page-title">Add Timetable</h2>
                                        <p className="page-subtitle">Configure class schedules for a new academic term.</p>
                                    </div>
                                    <div className="timetable-actions">
                                        <button className="btn-cancel" onClick={() => setActiveView('qr_generator')}>Cancel</button>
                                        <button className={`btn-save ${isSavingTimetable ? 'btn-disabled' : ''}`} onClick={handleSaveTimetable} disabled={isSavingTimetable}>
                                            {isSavingTimetable ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-regular fa-floppy-disk"></i>}
                                            {isSavingTimetable ? "Saving..." : "Save Timetable"}
                                        </button>
                                    </div>
                                </div>

                                <div className="timetable-grid">
                                    {/* Left Column: Context Panel */}
                                    <div className="context-panel">
                                        <h3 className="panel-title">
                                            <i className="fa-solid fa-sliders" style={{ color: 'var(--primary-red)' }}></i> Context
                                        </h3>
                                        
                                        <div className="form-group" style={{ marginBottom: '16px' }}>
                                            <label>Program / Course</label>
                                            <div className="select-wrapper">
                                                <select name="program" value={timetableContext.program} onChange={handleTimetableChange} className="custom-input">
                                                    <option value="">Select Program...</option>
                                                    <option value="Computer Science">Computer Science</option>
                                                    <option value="Artificial Intelligence & Data Science">Artificial Intelligence & Data Science</option>
                                                    <option value="Biomedical Engineering">Biomedical Engineering</option>
                                                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                                                    <option value="Electrical Engineering">Electrical Engineering</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="input-row" style={{ marginBottom: '16px' }}>
                                            <div className="form-group">
                                                <label>Year</label>
                                                <div className="select-wrapper">
                                                    <select name="year" value={timetableContext.year} onChange={handleTimetableChange} className="custom-input">
                                                        <option value="">Select Year...</option>
                                                        <option value="1-year">1-year</option>
                                                        <option value="2-year">2-year</option>
                                                        <option value="3-year">3-year</option>
                                                        <option value="4-year">4-year</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="form-group">
                                                <label>Semester</label>
                                                <div className="select-wrapper">
                                                    <select name="semester" value={timetableContext.semester} onChange={handleTimetableChange} className="custom-input">
                                                        <option value="">Select Sem...</option>
                                                        <option value="sem-1">sem-1</option>
                                                        <option value="sem-2">sem-2</option>
                                                        <option value="sem-3">sem-3</option>
                                                        <option value="sem-4">sem-4</option>
                                                        <option value="sem-5">sem-5</option>
                                                        <option value="sem-6">sem-6</option>
                                                        <option value="sem-7">sem-7</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="form-group" style={{ marginBottom: '16px' }}>
                                            <label>Section / Batch</label>
                                            <div className="select-wrapper">
                                                <select name="batch" value={timetableContext.batch} onChange={handleTimetableChange} className="custom-input">
                                                    <option value="">Select Batch...</option>
                                                    <option value="2023-2027">2023-2027</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="form-group" style={{ marginBottom: '16px' }}>
                                            <label>Time-Table Start Date</label>
                                            <input type="date" name="startDate" value={timetableContext.startDate} onChange={handleTimetableChange} className="custom-input" />
                                        </div>
                                        
                                        <div className="form-group" style={{ marginBottom: '24px' }}>
                                            <label>Time-Table End Date</label>
                                            <input type="date" name="endDate" value={timetableContext.endDate} onChange={handleTimetableChange} className="custom-input" />
                                        </div>

                                        <label style={{ fontSize: '0.8rem', fontWeight: 600, color: 'var(--text-muted)', textTransform: 'uppercase' }}>TEMPLATES</label>
                                        <div className="template-cards">
                                            <div className="template-card">
                                                <i className="fa-regular fa-copy"></i>
                                                <div style={{ fontSize: '0.85rem', fontWeight: 600 }}>Copy Previous</div>
                                            </div>
                                            <div className="template-card">
                                                <i className="fa-solid fa-wand-magic-sparkles"></i>
                                                <div style={{ fontSize: '0.85rem', fontWeight: 600 }}>Auto-Fill</div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Right Column: Schedule Entry & Preview */}
                                    <div className="schedule-panel">
                                        
                                        <div className="schedule-entry-card">
                                                    <div className="schedule-entry-header">
                                                        <i className="fa-regular fa-calendar-days" style={{ fontSize: '1.5rem', color: 'var(--primary-red)' }}></i>
                                                        <h3 style={{ fontSize: '1.25rem', fontWeight: 700, color: 'var(--text-dark)' }}>Schedule Entry</h3>
                                                        
                                                        {/* Dynamic Day Tabs */}
                                                        <div className="day-tabs">
                                                            {['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'].map(day => (
                                                                <div 
                                                                    key={day} 
                                                                    className={`day-tab ${activeDay === day ? 'active' : ''}`}
                                                                    onClick={() => setActiveDay(day)}
                                                                >
                                                                    {day}
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>

                                                    <div className="table-responsive-wrapper">
                                                        <table className="schedule-table">
                                                            <thead>
                                                                <tr>
                                                                    <th style={{ width: '110px' }}>Start Time</th>
                                                                    <th style={{ width: '110px' }}>End Time</th>
                                                                    <th>Subject</th>
                                                                    <th>Faculty</th>
                                                                    <th style={{ width: '110px' }}>Room</th>
                                                                    <th style={{ width: '60px', textAlign: 'center' }}>Action</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {/* Dynamic Row Rendering based on Active Day */}
                                                                {scheduleData[activeDay].map((row, index) => (
                                                                    <tr key={index}>
                                                                        <td><input type="time" value={row.startTime} onChange={(e) => handleScheduleChange(index, 'startTime', e.target.value)} /></td>
                                                                        <td><input type="time" value={row.endTime} onChange={(e) => handleScheduleChange(index, 'endTime', e.target.value)} /></td>
                                                                        <td><input type="text" value={row.subject} onChange={(e) => handleScheduleChange(index, 'subject', e.target.value)} placeholder="Subject" /></td>
                                                                        <td><input type="text" value={row.faculty} onChange={(e) => handleScheduleChange(index, 'faculty', e.target.value)} placeholder="Faculty" /></td>
                                                                        <td><input type="text" value={row.room} onChange={(e) => handleScheduleChange(index, 'room', e.target.value)} placeholder="Room" /></td>
                                                                        <td style={{ textAlign: 'center' }}>
                                                                            <button className="btn-delete-row" onClick={() => handleRemoveRow(index)}><i className="fa-regular fa-trash-can"></i></button>
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                                {/* Add New Row Button */}
                                                                <tr>
                                                                    <td colSpan="6" style={{ textAlign: 'center', padding: '16px' }}>
                                                                        <button className="btn-add-row" onClick={handleAddRow}><i className="fa-solid fa-plus"></i></button>
                                                                    </td>
                                                                </tr>
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>

                                                {/* Dynamic Timeline Preview */}
                                                <div className="timeline-preview-card">
                                                    <h4 className="timeline-title">Timeline Preview - {activeDay}</h4>
                                                    <div className="timeline-track" style={{ overflowX: 'auto' }}>
                                                        {scheduleData[activeDay].length === 0 ? (
                                                            <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#cbd5e1', fontSize: '0.9rem' }}>
                                                                No classes scheduled for {activeDay}. Add a row above.
                                                            </div>
                                                        ) : (
                                                            <>
                                                                {scheduleData[activeDay].map((row, i) => (
                                                                    <div key={i} className={`timeline-block filled-${(i % 2) + 1}`} style={{ flex: 1, minWidth: '150px' }}>
                                                                        <h5>{row.subject || 'Empty Subject'}</h5>
                                                                        <p>{row.startTime || '--:--'} - {row.endTime || '--:--'}</p>
                                                                    </div>
                                                                ))}
                                                                <div className="timeline-block" style={{ flex: 0.5, alignItems: 'center', color: '#cbd5e1', fontSize: '1.2rem', minWidth: '60px' }}>
                                                                    <i className="fa-solid fa-clock"></i>
                                                                </div>
                                                            </>
                                                        )}
                                                    </div>
                                                </div>

                                    </div>

                                    {/* NEW: Timetable History List (Right Column) */}
                                    <div className="history-card">
                                        <h3 className="history-title"><i className="fa-solid fa-cloud-arrow-down"></i> Saved Schedules</h3>
                                        
                                        {isLoadingTimetables ? (
                                            <div style={{ textAlign: 'center', padding: '20px', color: 'var(--text-muted)' }}>
                                                <i className="fa-solid fa-spinner fa-spin" style={{ fontSize: '2rem', marginBottom: '10px' }}></i>
                                                <p>Loading Firebase Data...</p>
                                            </div>
                                        ) : fetchError === 'missing_exports' ? (
                                            <div style={{ textAlign: 'center', padding: '20px', color: 'var(--primary-red)', backgroundColor: '#fff1f2', borderRadius: '8px', border: '1px solid #fecaca' }}>
                                                <i className="fa-solid fa-triangle-exclamation" style={{ fontSize: '1.5rem', marginBottom: '8px' }}></i>
                                                <p style={{ fontSize: '0.85rem', fontWeight: '700', marginBottom: '4px' }}>Setup Required</p>
                                                <p style={{ fontSize: '0.75rem', color: 'var(--text-main)' }}>To permanently fetch schedules, open your <b>firebaseconfig.js</b> file and ensure you add <code>collection</code> and <code>getDocs</code> to your exports.</p>
                                            </div>
                                        ) : fetchError === 'permission_error' ? (
                                            <div style={{ textAlign: 'center', padding: '20px', color: 'var(--primary-red)' }}>
                                                <p style={{ fontSize: '0.85rem', fontWeight: '600' }}>Failed to connect to Database.</p>
                                            </div>
                                        ) : timetableList.length === 0 ? (
                                            <p style={{color: 'var(--text-muted)', fontSize: '0.9rem', textAlign: 'center', marginTop: '30px'}}>
                                                No timetables saved yet.
                                            </p>
                                        ) : (
                                            timetableList.map(item => (
                                                <div key={item.id} className="history-item" onClick={() => handleLoadTimetable(item)} style={{ cursor: 'pointer', position: 'relative' }}>
                                                    
                                                    {/* NEW: Database Remove Icon Button */}
                                                    <button 
                                                        onClick={(e) => handleDeleteTimetable(e, item.id)} 
                                                        title="Delete permanently from Database"
                                                        style={{ position: 'absolute', top: '12px', right: '12px', background: 'none', border: 'none', color: '#94a3b8', cursor: 'pointer', fontSize: '0.9rem', transition: 'color 0.2s', zIndex: 10 }}
                                                        onMouseOver={(e) => e.target.style.color = 'var(--primary-red)'}
                                                        onMouseOut={(e) => e.target.style.color = '#94a3b8'}
                                                    >
                                                        <i className="fa-solid fa-trash-can"></i>
                                                    </button>

                                                    <div style={{ paddingRight: '24px' }}>
                                                        <h4 className="hist-course">{item.context.program}</h4>
                                                        <p className="hist-dept">{item.context.year} &bull; {item.context.semester}</p>
                                                        <p className="hist-date" style={{ marginTop: '4px' }}><i className="fa-solid fa-users"></i> {item.context.batch}</p>
                                                    </div>
                                                    <div className="hist-actions">
                                                        <button className="btn-hist-action" style={{ width: '100%', pointerEvents: 'none' }}>
                                                            <i className="fa-solid fa-arrow-rotate-left"></i> Load Schedule
                                                        </button>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>

                                </div>
                            </div>
                        )}

                        {/* NEW: Map UI Modal Overlay */}
                        {isMapModalOpen && (
                            <div className="map-modal-overlay">
                                <div className="map-modal">
                                    <h3>Set Class Coordinates</h3>
                                    <p>Please allow location access to plot the exact classroom.</p>
                                    
                                    {mapError && <div className="map-error-msg"><i className="fa-solid fa-triangle-exclamation"></i> {mapError}</div>}
                                    
                                    <div id="leaflet-map-container"></div>
                                    
                                    <div className="map-modal-actions">
                                        <button className="btn-action btn-download" onClick={() => setIsMapModalOpen(false)}>
                                            Cancel
                                        </button>
                                        <button className="btn-action btn-download" onClick={handleDetectLocation}>
                                            <i className="fa-solid fa-location-crosshairs"></i> Recalibrate
                                        </button>
                                        <button className="btn-action btn-print" onClick={() => setIsMapModalOpen(false)}>
                                            <i className="fa-solid fa-check"></i> Confirm Location
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>
                </>
            );
        }
        

        const root = ReactDOM.createRoot(document.getElementById('react-admin-root'));
        root.render(<AdminDashboard />);
    </script>
</body>
</html>
