<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/ksk logo.jpeg" type="image/x-icon">
    <title>Professor Portal - Admin</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- jsPDF for true PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- NEW: Leaflet Map Library for Location UI -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- FIREBASE SETUP via ES Modules -->
    <script type="module" src="firebaseconfig.js"></script>

    <style>
        .btn-disabled { opacity: 0.7; cursor: not-allowed !important; }
        :root {
            --primary-red: #bb0f1c;
            --primary-red-hover: #9b0c16;
            --sidebar-width: 260px;
            --bg-color: #f4f7fb;
            --white: #ffffff;
            --text-dark: #0f172a;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.08);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background: linear-gradient(135deg, #fdfdfe 0%, #edf2f8 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Layout */
        .sidebar { width: var(--sidebar-width); background-color: var(--white); border-right: 1px solid var(--border-light); display: flex; flex-direction: column; padding: 32px 0; position: fixed; height: 100vh; z-index: 100; }
        .sidebar-header { padding: 0 24px; margin-bottom: 40px; }
        .sidebar-header h1 { font-size: 1.5rem; font-weight: 800; color: var(--text-dark); line-height: 1.2; margin-bottom: 4px; }
        .sidebar-header p { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 0 16px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-decoration: none; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; border-radius: 8px; transition: all 0.2s ease; border-left: 3px solid transparent; }
        .nav-item i { font-size: 1.1rem; width: 20px; text-align: center; }
        .nav-item:hover { background-color: #f8fafc; color: var(--text-dark); }
        .nav-item.active { background-color: #fff1f2; color: var(--primary-red); border-left-color: var(--primary-red); }

        .sidebar-footer { padding: 0 24px; display: flex; flex-direction: column; gap: 16px; }
        .btn-start-class { background-color: var(--primary-red); color: var(--white); border: none; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; width: 100%; }
        .btn-start-class:hover { background-color: var(--primary-red-hover); }
        .footer-link { display: flex; align-items: center; gap: 12px; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
        .footer-link:hover { color: var(--text-dark); }

        /* Main Content Layout */
        .main-content { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Top Header */
        .top-header { height: 70px; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; background-color: transparent; }
        .header-links { display: flex; gap: 24px; }
        .header-links a { text-decoration: none; color: var(--text-muted); font-size: 0.85rem; font-weight: 500; }
        .header-links a:hover { color: var(--text-dark); }
        
        .header-actions { display: flex; align-items: center; gap: 20px; margin-left: auto; }
        .header-icon { color: var(--text-muted); font-size: 1.1rem; cursor: pointer; }
        .btn-new-session { background-color: var(--primary-red); color: var(--white); border: none; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .profile-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--white); box-shadow: var(--shadow-sm); cursor: pointer; transition: border-color 0.2s; }
        .profile-img:hover { border-color: var(--primary-red); }

        /* Profile Dropdown Styles */
        .profile-dropdown { position: relative; display: flex; align-items: center; }
        .dropdown-content { display: none; position: absolute; right: 0; top: 120%; background-color: var(--white); min-width: 220px; box-shadow: var(--shadow-md); border-radius: 10px; padding: 16px; z-index: 1000; text-align: center; border: 1px solid var(--border-light); }
        .dropdown-content.show { display: block; }
        .dropdown-profile-img { width: 56px; height: 56px; border-radius: 50%; margin-bottom: 12px; object-fit: cover; }
        .dropdown-email { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; word-break: break-all; }
        .logout-btn { background-color: #fef2f2; color: var(--primary-red); border: 1px solid #fecaca; padding: 10px 16px; border-radius: 6px; width: 100%; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
        .logout-btn:hover { background-color: var(--primary-red); color: var(--white); }

        /* Page Content */
        .page-content { padding: 20px 40px 40px; }
        .page-header { margin-bottom: 32px; }
        .page-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); margin-bottom: 8px; letter-spacing: -0.5px; }
        .page-subtitle { color: var(--text-muted); font-size: 1rem; }

        /* Split Layout (Updated for 3 Columns) */
        .grid-layout { display: grid; grid-template-columns: 1fr 1.1fr 0.9fr; gap: 24px; align-items: stretch; }
        
        /* NEW: History Card Styles */
        .history-card { background: var(--white); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 16px; max-height: 620px; overflow-y: auto; }
        .history-title { font-size: 1.1rem; font-weight: 700; color: var(--text-dark); border-bottom: 1px solid var(--border-light); padding-bottom: 12px; margin-bottom: 8px; position: sticky; top: -24px; background: var(--white); z-index: 10; margin-top: -8px; padding-top: 8px; }
        .history-item { background: #f8fafc; border: 1px solid var(--border-light); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: transform 0.2s, box-shadow 0.2s; }
        .history-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
        .hist-course { font-size: 0.95rem; font-weight: 700; color: var(--text-dark); margin-bottom: 2px; }
        .hist-dept { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
        .hist-date { font-size: 0.75rem; color: #94a3b8; }
        .hist-actions { display: flex; gap: 8px; margin-top: auto; }
        .btn-hist-action { flex: 1; padding: 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s; background: var(--white); border: 1px solid var(--border-light); color: var(--text-main); }
        .btn-hist-action:hover { background: #f1f5f9; color: var(--primary-red); border-color: #cbd5e1; }
        
        /* Custom Scrollbar for History */
        .history-card::-webkit-scrollbar { width: 6px; }
        .history-card::-webkit-scrollbar-track { background: transparent; }
        .history-card::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* Left Column: Form Card */
        .form-card { background: var(--white); border-radius: 16px; padding: 32px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 24px; }
        .form-section-title { font-size: 1.1rem; font-weight: 700; color: var(--text-dark); border-bottom: 1px solid var(--border-light); padding-bottom: 12px; margin-bottom: 8px; }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-dark); }
        
        /* Custom Select & Input */
        .custom-input { background-color: #f1f5f9; border: 1px solid transparent; border-radius: 8px; padding: 12px 16px; font-size: 0.95rem; font-family: inherit; color: var(--text-dark); width: 100%; transition: all 0.2s; outline: none; appearance: none; }
        .custom-input:focus { background-color: var(--white); border-color: #cbd5e1; box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.05); }
        .select-wrapper { position: relative; }
        .select-wrapper::after { content: '\f078'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; color: var(--text-muted); pointer-events: none; }
        
        .btn-generate { background-color: #0f172a; color: var(--white); border: none; padding: 14px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: auto; }
        .btn-generate:hover { background-color: #1e293b; }

        /* Right Column: QR Preview Card */
        .qr-preview-container { background-color: var(--white); border-radius: 16px; padding: 40px; display: flex; justify-content: center; align-items: center; box-shadow: var(--shadow-md); position: relative; overflow: hidden; min-height: 500px; }
        
        /* Grid Background Pattern */
        .qr-preview-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(to right, #f1f5f9 1px, transparent 1px), linear-gradient(to bottom, #f1f5f9 1px, transparent 1px); background-size: 40px 40px; z-index: 1; }
        
        .qr-card-inner { background: var(--white); border-radius: 16px; padding: 40px 32px; box-shadow: var(--shadow-lg); z-index: 2; text-align: center; width: 340px; display: flex; flex-direction: column; align-items: center; }
        .qr-image { width: 180px; height: 180px; margin-bottom: 32px; object-fit: contain; }
        
        .qr-course-title { font-size: 1.1rem; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
        .qr-meta-text { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; }
        
        .qr-actions { display: flex; gap: 12px; width: 100%; }
        .btn-action { flex: 1; padding: 10px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s; }
        .btn-download { background: transparent; border: 1px solid var(--border-light); color: var(--text-dark); }
        .btn-download:hover { background: #f8fafc; }
        .btn-print { background: var(--primary-red); border: 1px solid var(--primary-red); color: var(--white); }
        .btn-print:hover { background: var(--primary-red-hover); }

        /* Sidebar Mobile Overlay */
        .mobile-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.4); z-index: 90; opacity: 0; transition: opacity 0.3s ease; backdrop-filter: blur(2px); }
        .mobile-overlay.show { display: block; opacity: 1; }
        
        /* Mobile Menu Button */
        .menu-toggle-btn { display: none; background: transparent; border: none; font-size: 1.4rem; color: var(--text-dark); cursor: pointer; margin-right: 16px; padding: 4px; transition: color 0.2s; }
        .menu-toggle-btn:hover { color: var(--primary-red); }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .grid-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
            .timetable-grid { grid-template-columns: 280px minmax(0, 1fr); }
            .history-card { grid-column: span 2; }
        }
        @media (max-width: 1024px) {
            .timetable-grid { grid-template-columns: minmax(0, 1fr); }
            .history-card { grid-column: span 1; }
            .dept-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 900px) {
            .grid-layout { grid-template-columns: minmax(0, 1fr); }
            .history-card { grid-column: span 1; }
            .dept-grid { grid-template-columns: minmax(0, 1fr); }
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: var(--shadow-lg); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; width: 100vw; overflow-x: hidden; }
            .top-header { padding: 0 16px; justify-content: space-between; }
            .header-left { display: flex; align-items: center; }
            .page-content { padding: 16px; width: 100%; overflow-x: hidden; }
            .header-links { display: none; }
            .menu-toggle-btn { display: block; margin-right: 12px; }
            
            /* Prevent crowding on small screens */
            .header-actions .fa-circle-question { display: none; }
            .btn-new-session { padding: 6px 12px; font-size: 0.75rem; }

            /* --- STRICT MOBILE UI FIXES --- */
            .page-title { font-size: 1.6rem; text-align: left; }
            .page-subtitle { text-align: left; font-size: 0.9rem; }
            
            /* NEW: Force Select Department Grid to Stack on Mobile */
            .dept-grid { grid-template-columns: minmax(0, 1fr) !important; gap: 16px !important; }
            
            /* Force dual inputs to stack vertically */
            .input-row { display: flex !important; flex-direction: column !important; gap: 16px !important; } 
            
            /* Reduce paddings to fit narrow screens */
            .form-card, .context-panel, .schedule-entry-card, .timeline-preview-card, .history-card { padding: 16px !important; }
            
            /* Timetable UI Fixes */
            .timetable-header-row { display: flex !important; flex-direction: column !important; align-items: flex-start !important; gap: 16px !important; margin-bottom: 24px !important; width: 100%; }
            .timetable-header-row .page-header { width: 100%; text-align: left; }
            .timetable-actions { width: 100% !important; display: flex !important; flex-direction: row !important; gap: 12px !important; }
            .btn-cancel, .btn-save { flex: 1 !important; justify-content: center !important; text-align: center !important; padding: 12px !important; font-size: 0.9rem; }
            
            /* Schedule Entry Tab scrolling */
            .schedule-entry-header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .day-tabs { margin-left: 0; width: 100%; overflow-x: auto; padding-bottom: 8px; }
            
            /* QR Generator Mobile Fixes */
            .qr-preview-container { padding: 16px; min-height: auto; }
            .qr-card-inner { width: 100%; padding: 24px 16px; }
            .qr-image { width: 150px; height: 150px; }
            
            .qr-actions { display: flex !important; flex-direction: column !important; gap: 10px !important; width: 100%; }
            .btn-action { padding: 12px; width: 100%; }
            .hist-actions { display: flex !important; flex-direction: column !important; gap: 8px; }
        }
        
        /* Timetable Empty State */
        .empty-schedule-state { background: var(--white); border-radius: 16px; padding: 60px 20px; text-align: center; border: 2px dashed #cbd5e1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 400px; color: var(--text-muted); }
        .empty-schedule-state i { font-size: 3.5rem; color: #cbd5e1; margin-bottom: 16px; }
        .empty-schedule-state h4 { font-size: 1.25rem; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }
        .empty-schedule-state p { font-size: 0.95rem; max-width: 350px; line-height: 1.5; }

        /* NEW: Map Modal Overlay Styles */
        .map-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); z-index: 9999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(4px); opacity: 0; animation: fadeIn 0.2s forwards; }
        .map-modal { background: var(--white); border-radius: 16px; padding: 32px; width: 90%; max-width: 600px; box-shadow: var(--shadow-lg); transform: scale(0.95); animation: scaleUp 0.2s forwards; display: flex; flex-direction: column; }
        .map-modal h3 { font-size: 1.25rem; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
        .map-modal p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; }
        .map-error-msg { background: #fff1f2; color: var(--primary-red); padding: 12px 16px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; border: 1px solid #fecaca; font-weight: 500; }
        #leaflet-map-container { height: 320px; width: 100%; border-radius: 12px; margin-bottom: 24px; border: 1px solid var(--border-light); z-index: 1; }
        .map-modal-actions { display: flex; justify-content: flex-end; gap: 12px; }
        
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes scaleUp { to { transform: scale(1); } }

        /* NEW: Select Department View Styles */
        .dept-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .dept-search-bar { display: flex; gap: 16px; align-items: center; flex: 1; max-width: 600px; }
        .dept-search-input { flex: 1; padding: 12px 16px; border: 1px solid var(--border-light); border-radius: 8px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; font-family: inherit; }
        .dept-search-input:focus { border-color: var(--primary-red); }
        .dept-select { padding: 12px 16px; border: 1px solid var(--border-light); border-radius: 8px; font-size: 0.95rem; outline: none; background: var(--white); font-family: inherit; cursor: pointer; }
        .btn-add-dept { background: transparent; color: var(--primary-red); border: none; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: opacity 0.2s; }
        .btn-add-dept:hover { opacity: 0.8; }
        
        /* Force grid to span the absolute full width with 3 equal columns */
        .dept-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; margin-bottom: 80px; width: 100%; }
        
        .dept-card { background: var(--white); border: 2px solid transparent; border-radius: 16px; padding: 24px; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm); position: relative; }
        .dept-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .dept-card.selected { border-color: var(--primary-red); box-shadow: 0 4px 20px rgba(187, 15, 28, 0.08); }
        .dept-badge { position: absolute; top: 24px; right: 24px; width: 24px; height: 24px; background: var(--primary-red); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.8rem; opacity: 0; transform: scale(0.8); transition: all 0.2s; }
        .dept-card.selected .dept-badge { opacity: 1; transform: scale(1); }
        .dept-tag { font-size: 0.75rem; font-weight: 700; padding: 6px 10px; border-radius: 6px; background: #f1f5f9; color: var(--text-muted); display: inline-block; margin-bottom: 16px; }
        .dept-card.selected .dept-tag { background: #ffeef0; color: var(--primary-red); }
        .dept-title { font-size: 1.3rem; font-weight: 800; color: var(--text-dark); margin-bottom: 24px; display: flex; align-items: center; gap: 16px; }
        .dept-icon { background: #f8fafc; width: 48px; height: 48px; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: var(--text-main); font-size: 1.4rem; flex-shrink: 0; transition: all 0.2s; }
        .dept-card.selected .dept-icon { background: #ffeef0; color: var(--primary-red); }
        .dept-hod { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border-light); }
        .hod-avatar { width: 42px; height: 42px; border-radius: 50%; background: #e2e8f0; display: flex; justify-content: center; align-items: center; color: var(--text-muted); font-size: 1rem; }
        .hod-info h5 { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px; }
        .hod-info p { font-size: 0.95rem; color: var(--text-dark); font-weight: 500; }
        .dept-stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; margin-bottom: 24px; }
        .stat-val { font-size: 1.4rem; font-weight: 800; color: var(--text-dark); margin-bottom: 6px; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .dept-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); transition: color 0.2s; }
        .dept-card.selected .dept-footer { color: var(--primary-red); }
        
        .bottom-confirm-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--white); border-top: 1px solid var(--border-light); padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); z-index: 1000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateY(100%); }
        .bottom-confirm-bar.show { transform: translateY(0); }
        .confirm-details { display: flex; align-items: center; gap: 16px; }
        .confirm-icon { width: 40px; height: 40px; background: #ffeef0; color: var(--primary-red); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }
        .confirm-text p { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 2px; letter-spacing: 0.5px; }
        .confirm-text h4 { font-size: 1rem; color: var(--text-dark); font-weight: 700; }
        .confirm-actions { display: flex; gap: 16px; align-items: center; }
        .btn-confirm-enter { background: var(--primary-red); color: var(--white); border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s; box-shadow: 0 4px 12px rgba(187, 15, 28, 0.2); }
        .btn-confirm-enter:hover { background: var(--primary-red-hover); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(187, 15, 28, 0.3); }

        @media (max-width: 768px) {
            .dept-header-top { flex-direction: column; align-items: stretch; }
            .dept-search-bar { flex-direction: column; max-width: 100%; }
            .dept-search-input, .dept-select { width: 100%; }

        @media (max-width: 1024px) {

        /* NEW: Professional Connection Loader Animation & Flight Path */
        .connection-loader-container { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 24px; }
        .loader-node { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--white); background: var(--white); display: flex; align-items: center; justify-content: center; position: relative; z-index: 2; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .loader-node img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .loader-node i { font-size: 2rem; color: var(--text-dark); }
        
        .zigzag-line { width: 120px; height: 40px; z-index: 1; }
        .zigzag-path { fill: none; stroke: var(--primary-red); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 200; stroke-dashoffset: 200; animation: zigzagDraw 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        @keyframes zigzagDraw { 0% { stroke-dashoffset: 200; } 50% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -200; } }
        
        .pulse-ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 0 0 rgba(187, 15, 28, 0.7); animation: loaderPulse 1.8s infinite; pointer-events: none; z-index: -1; }
        @keyframes loaderPulse { 0% { box-shadow: 0 0 0 0 rgba(187, 15, 28, 0.5); } 70% { box-shadow: 0 0 0 15px rgba(187, 15, 28, 0); } 100% { box-shadow: 0 0 0 0 rgba(187, 15, 28, 0); } }

        .react-overlay-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at 30% 20%, #e6eff9 0%, #f4f7fb 40%, #e0eaf5 100%); font-family: 'Inter', sans-serif; overflow-y: auto; backdrop-filter: blur(5px); }

        .flying-out .zigzag-line, .flying-out .loading-text-block { opacity: 0 !important; transition: opacity 0.3s ease; }
        .flying-out .pulse-ring { display: none; }
        .node-left, .node-right { transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease; z-index: 9999; }
        .flying-out .node-left { transform: translate(-35vw, -40vh) scale(0.5); opacity: 0; }
        .flying-out .node-right { transform: translate(35vw, -40vh) scale(0.5); opacity: 0; }
        @media (max-width: 768px) {
            .flying-out .node-left { transform: translate(-40vw, -45vh) scale(0.4); }

<body>

    <div id="react-admin-root"></div>

    <script type="text/babel">
        function AdminDashboard() {
            // Navigation State (SPA Routing) - Starts on 'select_department'
            const [activeView, setActiveView] = React.useState('select_department');

            // NEW: Dynamic Department & Student Count States
            const [selectedDept, setSelectedDept] = React.useState(null);
            const [dbDepartments, setDbDepartments] = React.useState([]);
            const [studentCounts, setStudentCounts] = React.useState({});
            
            // NEW: Add Department Form State
            const [isAddDeptModalOpen, setIsAddDeptModalOpen] = React.useState(false);
            const [isSavingDept, setIsSavingDept] = React.useState(false);
            const [newDeptForm, setNewDeptForm] = React.useState({
                departmentName: '', shortForm: '', hod: '', faculty: '', courses: '', password: ''
            });

            // NEW: Live Database Validation State for Department Name
            const [deptNameStatus, setDeptNameStatus] = React.useState('idle'); // idle, checking, available, taken

            React.useEffect(() => {
                const deptValue = newDeptForm.departmentName; 

                if (!deptValue || deptValue.trim() === '') {
                    setDeptNameStatus('idle');
                    return;
                }

                setDeptNameStatus('checking');
                // 600ms debounce to prevent database spamming while typing
                const timeoutId = setTimeout(async () => {
                    try {
                        let exists = false;
                        const deptsRef = window.firebaseAuth.collection(window.firebaseAuth.db, "departments");
                        const snap = await window.firebaseAuth.getDocs(deptsRef);
                        
                        snap.forEach(doc => {
                            if (doc.data().title && doc.data().title.toLowerCase() === deptValue.toLowerCase().trim()) {
                                exists = true;
                            }
                        });
                        
                        setDeptNameStatus(exists ? 'taken' : 'available');
                    } catch (err) {
                        console.warn("DB Verification error:", err);
                        setDeptNameStatus('available'); // Fallback gracefully if permissions lag
                    }
                }, 600); 

                return () => clearTimeout(timeoutId);
            }, [newDeptForm.departmentName]);

            // NEW: Verification Modal State
            const [isVerifyModalOpen, setIsVerifyModalOpen] = React.useState(false);
            const [verifyPassword, setVerifyPassword] = React.useState('');
            const [isVerifying, setIsVerifying] = React.useState(false);
            const [verifyError, setVerifyError] = React.useState('');
            const [showVerifyPassword, setShowVerifyPassword] = React.useState(false);
            const [isTransitioning, setIsTransitioning] = React.useState(false); // NEW: Cinematic Transition State
            const [isConnectingContext, setIsConnectingContext] = React.useState(false); // NEW: Full-screen overlay state

            const handleVerifySubmit = (e) => {
                e.preventDefault();
                if (!verifyPassword) {
                    setVerifyError("Please enter the access key.");
                    return;
                }
                setIsVerifying(true);
                setVerifyError('');

                // Securely decrypt the stored password for verification
                let decryptedStoredPassword = '';
                try {
                    decryptedStoredPassword = selectedDept.password ? decodeURIComponent(atob(selectedDept.password)) : '';
                } catch (e) {
                    console.error("Decryption error", e);
                }
                
                if (selectedDept && verifyPassword === decryptedStoredPassword) {
                    // Password matches! Trigger the cinematic overlay
                    setIsVerifyModalOpen(false); // Hide the modal instantly
                    setIsConnectingContext(true); // Show the Zigzag loader
                    
                    // Store the selected department so department.html knows the context
                    localStorage.setItem('active_department', JSON.stringify(selectedDept));
                    
                    // Wait 1.5 seconds for the animation to play, then trigger the Fly-Out
                    setTimeout(() => {
                        setIsTransitioning(true);
                        
                        // Wait 800ms for the icons to fly to the corners, THEN change the page!
                        setTimeout(() => {
                            window.location.href = 'department.html';
                        }, 800);
                    }, 1500);
                } else {
                    setVerifyError("Incorrect department access key.");
                    setIsVerifying(false);
                }
            };

            // Fetch Real Departments & Calculate Student Counts from Firebase
            React.useEffect(() => {
                if (activeView === 'select_department' && window.firebaseAuth && window.firebaseAuth.db) {
                    const fetchData = async () => {
                        try {
                            if (window.firebaseAuth.collection && window.firebaseAuth.getDocs) {
                                // 1. Fetch Departments
                                const deptRef = window.firebaseAuth.collection(window.firebaseAuth.db, "departments");
                                const deptSnap = await window.firebaseAuth.getDocs(deptRef);
                                const fetchedDepts = [];
                                deptSnap.forEach(doc => fetchedDepts.push({ id: doc.id, ...doc.data() }));
                                // Sort alphabetically
                                fetchedDepts.sort((a, b) => a.title.localeCompare(b.title));
                                setDbDepartments(fetchedDepts);

                                // 2. Fetch Users & Tally Student Counts matching Department Names
                                const usersRef = window.firebaseAuth.collection(window.firebaseAuth.db, "users");
                                const usersSnap = await window.firebaseAuth.getDocs(usersRef);
                                const counts = {};
                                usersSnap.forEach(doc => {
                                    const dept = doc.data().department;
                                    if (dept) {
                                        counts[dept] = (counts[dept] || 0) + 1;
                                    }
                                });
                                setStudentCounts(counts);
                            }
                        } catch (err) {
                            console.error("Error fetching department dashboard data:", err);
                        }
                    };
                    fetchData();
                }
            }, [activeView]);

            const handleDeptFormChange = (e) => {
                setNewDeptForm({ ...newDeptForm, [e.target.name]: e.target.value });
            };

            const handleAddDepartmentSubmit = async (e) => {
                e.preventDefault();
                if (!newDeptForm.password) { alert("Authorization password required."); return; }
                
                setIsSavingDept(true);
                try {
                    const docId = newDeptForm.shortForm.toUpperCase().replace(/\s+/g, '') || Date.now().toString();
                    
                    // Automatically assign professional FontAwesome icon based on selection
                    let mappedIcon = 'fa-building';
                    if (newDeptForm.departmentName.includes('Computer')) mappedIcon = 'fa-laptop-code';
                    if (newDeptForm.departmentName.includes('Artificial')) mappedIcon = 'fa-network-wired';
                    if (newDeptForm.departmentName.includes('Biomedical')) mappedIcon = 'fa-heart-pulse';
                    if (newDeptForm.departmentName.includes('Mechanical')) mappedIcon = 'fa-cogs';
                    if (newDeptForm.departmentName.includes('Electrical')) mappedIcon = 'fa-bolt';

                    // Securely Encrypt the password before storing in Database
                    const encryptedPassword = btoa(encodeURIComponent(newDeptForm.password));

                    const newDeptPayload = {
                        title: newDeptForm.departmentName,
                        code: newDeptForm.shortForm.toUpperCase(),
                        hod: newDeptForm.hod,
                        faculty: parseInt(newDeptForm.faculty) || 0,
                        courses: parseInt(newDeptForm.courses) || 0,
                        icon: mappedIcon,
                        password: encryptedPassword, // Stored securely as an encrypted string
                        createdAt: new Date().toISOString()
                    };

                    await window.firebaseAuth.setDoc(
                        window.firebaseAuth.doc(window.firebaseAuth.db, "departments", docId),
                        newDeptPayload
                    );

                    // Update UI immediately without reload
                    setDbDepartments(prev => [...prev, { id: docId, ...newDeptPayload }].sort((a, b) => a.title.localeCompare(b.title)));
                    
                    // Reset and close modal
                    setIsAddDeptModalOpen(false);
                    setNewDeptForm({ departmentName: '', shortForm: '', hod: '', faculty: '', courses: '', password: '' });
                    alert(`Successfully added ${newDeptPayload.title} to database!`);
                } catch (err) {
                    console.error("Save error:", err);
                    alert("Failed to save department. Ensure admin permissions are active.");
                } finally {
                    setIsSavingDept(false);
                }
            };

            // Security State for Admin Access
            const [isAuthorized, setIsAuthorized] = React.useState(false);
            
            // Sidebar Mobile Toggle State
            const [isSidebarOpen, setIsSidebarOpen] = React.useState(false);
            
            // Profile Dropdown State & User Data
            const [isDropdownOpen, setIsDropdownOpen] = React.useState(false);
            const [adminProfile, setAdminProfile] = React.useState({ name: 'Admin', email: '', photoUrl: '' });
            
            // State for dynamic QR Card updates
            const [formData, setFormData] = React.useState({
                department: 'Computer Science',
                year: '2-year',
                semester: 'sem-3',
                course: 'GE3791- Human Values And Ethics',
                room: 'CR-200',
                expiration: '15',
                latitude: '',
                longitude: ''
            });

            // Map UI States
            const [isMapModalOpen, setIsMapModalOpen] = React.useState(false);
            const [mapError, setMapError] = React.useState('');
            const mapRef = React.useRef(null);
            const markerRef = React.useRef(null);

            // State for actual Generated QR code URL (Starts as null to show Empty State)
            const [qrUrl, setQrUrl] = React.useState(null);
            const [highResQrUrl, setHighResQrUrl] = React.useState(null);

            // Loading UX States
            const [isGenerating, setIsGenerating] = React.useState(false);
            const [isDownloading, setIsDownloading] = React.useState(false);
            const [isPrinting, setIsPrinting] = React.useState(false);

            // NEW: QR Code History State
            const [qrHistory, setQrHistory] = React.useState([]);

            // Load history from LocalStorage on mount
            React.useEffect(() => {
                const savedHistory = localStorage.getItem('kskcet_qr_history');
                if (savedHistory) {
                    setQrHistory(JSON.parse(savedHistory));
                }
            }, []);

            // NEW: Timetable Context State & Validation Logic
            const [timetableContext, setTimetableContext] = React.useState({
                program: '',
                year: '',
                semester: '',
                batch: '',
                startDate: '',
                endDate: ''
            });

            // NEW: Timetable Schedule State
            const [activeDay, setActiveDay] = React.useState('Monday');
            const [scheduleData, setScheduleData] = React.useState({
                Monday: [],
                Tuesday: [],
                Wednesday: [],
                Thursday: [],
                Friday: []
            });
            const [isSavingTimetable, setIsSavingTimetable] = React.useState(false);

            // NEW: Fetched Timetable List State from Firebase
            const [timetableList, setTimetableList] = React.useState([]);
            const [isLoadingTimetables, setIsLoadingTimetables] = React.useState(false);
            const [fetchError, setFetchError] = React.useState('');

            // Fetch stored timetables when the view opens
            React.useEffect(() => {
                if (activeView === 'class_management' && window.firebaseAuth && window.firebaseAuth.db) {
                    const fetchTimetables = async () => {
                        setIsLoadingTimetables(true);

                                snapshot.forEach(doc => {

            const isContextFilled = () => {
                return timetableContext.program !== '' &&

            const handleAddRow = () => {

                    ...prev,

            // TIME FORMAT HELPERS (12hr <-> 24hr Translation)
            const convertTo12Hour = (time24) => {
                if (!time24) return '';
                const [h, m] = time24.split(':');
                const hours = parseInt(h, 10);
                const ampm = hours >= 12 ? 'PM' : 'AM';
                const hours12 = hours % 12 || 12;
                return `${hours12.toString().padStart(2, '0')}:${m} ${ampm}`;
            };

            const convertTo24Hour = (time12) => {
                if (!time12) return '';
                const parts = time12.split(' ');
                if (parts.length < 2) return time12; // Already 24h fallback
                let [hours, minutes] = parts[0].split(':');
                if (hours === '12') hours = '00';
                if (parts[1] === 'PM') hours = (parseInt(hours, 10) + 12).toString();
                return `${hours.padStart(2, '0')}:${minutes}`;
            };

                const loadedSchedule = { Monday: [], Tuesday: [], Wednesday: [], Thursday: [], Friday: [], Saturday: [], ...item.schedule };
                Object.keys(loadedSchedule).forEach(day => {
                    loadedSchedule[day] = loadedSchedule[day].map(row => ({
                        ...row,
                        startTime: convertTo24Hour(row.startTime),

                                                <span className="dept-tag">{dept.code}</span>
                                                <div className="dept-title">
                                                    <div className="dept-icon"><i className={`fa-solid ${dept.icon}`}></i></div>
                                                    {dept.title}
                                                </div>
                                                <div className="dept-hod">
                                                    <div className="hod-avatar"><i className="fa-regular fa-user"></i></div>
                                                    <div className="hod-info">
                                                        <h5>Head of Department</h5>
                                                        <p>{dept.hod}</p>
                                                    </div>
                                                </div>
                                                <div className="dept-stats">
                                                    <div>
                                                        {/* Live Student Count from Database! */}
                                                        <div className="stat-val">{studentCounts[dept.title] || 0}</div>
                                                        <div className="stat-label">Students</div>
                                                    </div>
                                                    <div>
                                                        <div className="stat-val">{dept.faculty}</div>
                                                        <div className="stat-label">Faculty</div>
                                                    </div>
                                                    <div>
                                                        <div className="stat-val">{dept.courses}</div>
                                                        <div className="stat-label">Courses</div>
                                                    </div>
                                                </div>
                                                <div className="dept-footer">
                                                    <span>
                                                        <i className="fa-solid fa-circle" style={{fontSize: '8px', marginRight: '6px', color: selectedDept?.id === dept.id ? 'var(--primary-red)' : '#cbd5e1'}}></i> 
                                                        {selectedDept?.id === dept.id ? 'Selected' : 'Select'}
                                                    </span>
                                                    <i className="fa-solid fa-chevron-right" style={{ color: selectedDept?.id === dept.id ? 'var(--primary-red)' : '#cbd5e1' }}></i>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {/* Bottom Sticky Confirmation Bar */}
                                <div className={`bottom-confirm-bar ${selectedDept ? 'show' : ''}`}>
                                    <div className="confirm-details">
                                        <div className="confirm-icon"><i className="fa-regular fa-building"></i></div>
                                        <div className="confirm-text">
                                            <p>CURRENT SELECTION</p>
                                            <h4>Selected Department: {selectedDept?.title} ({selectedDept?.students} Students)</h4>
                                        </div>
                                    </div>
                                    <div className="confirm-actions">
                                        <button className="btn-cancel" style={{ border: 'none', background: 'transparent' }} onClick={() => setSelectedDept(null)}>Cancel</button>
                                        <button className="btn-confirm-enter" onClick={() => {
                                            setIsVerifyModalOpen(true);
                                            setVerifyPassword('');
                                            setVerifyError('');
                                        }}>
                                            Confirm & Enter Department <i className="fa-solid fa-arrow-right"></i>
                                        </button>
                                    </div>
                                </div>

                                {/* NEW: Add Department Modal Overlay */}
                                {isAddDeptModalOpen && (
                                    <div className="dept-modal-overlay">
                                        <div className="dept-modal">
                                            <div className="dept-modal-header">
                                                <h3><i className="fa-solid fa-server" style={{color: 'var(--primary-red)', marginRight: '8px'}}></i> Configure Department</h3>
                                                <button className="btn-close-modal" onClick={() => setIsAddDeptModalOpen(false)}>
                                                    <i className="fa-solid fa-xmark"></i>
                                                </button>
                                            </div>
                                            
                                            <form onSubmit={handleAddDepartmentSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                                                <div className="form-group">
                                                    <label>Department Name</label>
                                                    <div className="input-with-icon select-wrapper" style={{ position: 'relative' }}>
                                                        <i className="fa-regular fa-building" style={{ position: 'absolute', left: '14px', top: '50%', transform: 'translateY(-50%)', color: '#64748b', zIndex: 2 }}></i>
                                                        <select 
                                                            className="custom-input" 
                                                            name="departmentName" 
                                                            value={newDeptForm.departmentName} 
                                                            onChange={handleDeptFormChange} 
                                                            required
                                                            style={{ 
                                                                paddingLeft: '40px',
                                                                borderColor: deptNameStatus === 'available' ? '#10b981' : (deptNameStatus === 'taken' ? '#ef4444' : ''),
                                                                paddingRight: '60px',
                                                                color: newDeptForm.departmentName === "" ? "#94a3b8" : "var(--text-dark)"
                                                            }}
                                                        >
                                                            <option value="" disabled>Select Core Program...</option>
                                                            <option value="Computer Science">💻 Computer Science</option>
                                                            <option value="Artificial Intelligence & Machine Learning">🤖 Artificial Intelligence & Machine Learning</option>
                                                            <option value="Artificial Intelligence & Data Science">🤖 Artificial Intelligence & Data Science</option>
                                                            <option value="Biomedical Engineering">🧬 Biomedical Engineering</option>
                                                            <option value="Mechanical Engineering">⚙️ Mechanical Engineering</option>
                                                            <option value="Electrical Engineering">⚡ Electrical Engineering</option>
                                                        </select>
                                                        
                                                        {/* Live Validation Icons shifted slightly left to clear the native dropdown arrow */}
                                                        {deptNameStatus === 'checking' && <i className="fa-solid fa-spinner fa-spin" style={{ position: 'absolute', right: '35px', top: '50%', transform: 'translateY(-50%)', color: '#94a3b8', zIndex: 2 }}></i>}
                                                        {deptNameStatus === 'available' && <i className="fa-solid fa-circle-check" style={{ position: 'absolute', right: '35px', top: '50%', transform: 'translateY(-50%)', color: '#10b981', zIndex: 2 }}></i>}
                                                        {deptNameStatus === 'taken' && <i className="fa-solid fa-circle-xmark" style={{ position: 'absolute', right: '35px', top: '50%', transform: 'translateY(-50%)', color: '#ef4444', zIndex: 2 }}></i>}
                                                    </div>
                                                    
                                                    {/* Live DB Professional Alert Text */}
                                                    {deptNameStatus === 'taken' && <span style={{ fontSize: '0.75rem', color: '#ef4444', marginTop: '4px', fontWeight: '600', display: 'block' }}>This department name is already in use. Please choose another.</span>}
                                                    {deptNameStatus === 'available' && <span style={{ fontSize: '0.75rem', color: '#10b981', marginTop: '4px', fontWeight: '600', display: 'block' }}>Department name verified and available for registration.</span>}
                                                </div>
                                                
                                                <div className="input-row">
                                                    <div className="form-group">
                                                        <label>Short Form (Code)</label>
                                                        <input type="text" className="custom-input" name="shortForm" placeholder="e.g. CSE" value={newDeptForm.shortForm} onChange={handleDeptFormChange} required />
                                                    </div>
                                                    <div className="form-group">
                                                        <label>HOD Name</label>
                                                        <input type="text" className="custom-input" name="hod" placeholder="e.g. Dr. Turing" value={newDeptForm.hod} onChange={handleDeptFormChange} required />
                                                    </div>
                                                </div>
                                                
                                                <div className="input-row">
                                                    <div className="form-group">
                                                        <label>Total Faculty</label>
                                                        <input type="number" className="custom-input" name="faculty" min="0" value={newDeptForm.faculty} onChange={handleDeptFormChange} required />
                                                    </div>
                                                    <div className="form-group">
                                                        <label>Total Courses</label>
                                                        <input type="number" className="custom-input" name="courses" min="0" value={newDeptForm.courses} onChange={handleDeptFormChange} required />
                                                    </div>
                                                </div>

                                                <div className="form-group" style={{ marginTop: '8px' }}>
                                                    <label>Authorization Password</label>
                                                    <input type="password" className="custom-input" name="password" placeholder="Enter admin password to save" value={newDeptForm.password} onChange={handleDeptFormChange} required />
                                                </div>

                                                <button type="submit" className={`btn-save ${(isSavingDept || deptNameStatus !== 'available' || !newDeptForm.password) ? 'btn-disabled' : ''}`} style={{ marginTop: '16px', justifyContent: 'center', width: '100%', padding: '14px' }} disabled={isSavingDept || deptNameStatus !== 'available' || !newDeptForm.password}>
                                                    {isSavingDept ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-cloud-arrow-up"></i>}
                                                    {isSavingDept ? " Syncing to Database..." : " Save Department"}
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                )}

                                {/* NEW: Department Verification Security Modal */}
                                {isVerifyModalOpen && selectedDept && (
                                    <div className="verify-modal-overlay">
                                        <div className="verify-modal">
                                            <div className="verify-modal-inner">
                                                <div className="verify-header">
                                                    <div className="verify-icon-box"><i className="fa-solid fa-lock"></i></div>
                                                    <div className="verify-header-text">
                                                        <h3>Department Access Verification</h3>
                                                        <p>Admin Security Authentication Required</p>
                                                    </div>
                                                    <button className="btn-verify-close" onClick={() => setIsVerifyModalOpen(false)}>
                                                        <i className="fa-solid fa-xmark"></i>
                                                    </button>
                                                </div>

                                                <div className="verify-context-box">
                                                    <div className="verify-context-icon"><i className={`fa-solid ${selectedDept.icon || 'fa-building'}`}></i></div>
                                                    <div className="verify-context-text">
                                                        <p>{selectedDept.code} &bull; {studentCounts[selectedDept.title] || 0} Students</p>
                                                        <h4>{selectedDept.title}</h4>
                                                    </div>
                                                </div>

                                                <p className="verify-form-desc">
                                                    Please enter your department security key or administrative credentials to proceed to the course management console.
                                                </p>

                                                {verifyError && <div className="map-error-msg" style={{marginBottom: '16px'}}><i className="fa-solid fa-triangle-exclamation"></i> {verifyError}</div>}

                                                <form onSubmit={handleVerifySubmit}>
                                                    <div className="verify-input-group">
                                                        <label>Department Access Key</label>
                                                        <div className="verify-input-wrapper">
                                                            <i className="fa-solid fa-key"></i>
                                                            <input 
                                                                type={showVerifyPassword ? "text" : "password"} 
                                                                value={verifyPassword}
                                                                onChange={(e) => setVerifyPassword(e.target.value)}
                                                                placeholder="••••••••••••" 
                                                                required 
                                                            />
                                                            <i 
                                                                className={`fa-regular ${showVerifyPassword ? "fa-eye-slash" : "fa-eye"}`} 
                                                                onClick={() => setShowVerifyPassword(!showVerifyPassword)}
                                                            ></i>
                                                        </div>
                                                    </div>

                                                    <div className="verify-options">
                                                        <label className="verify-remember">
                                                            <input type="checkbox" defaultChecked /> Remember access for this session
                                                        </label>
                                                    </div>
                                                </form>
                                            </div>

                                            <div className="verify-actions">
                                                <button className="btn-verify-back" onClick={() => setIsVerifyModalOpen(false)}>Back to Selection</button>
                                                <button className={`btn-verify-submit ${isVerifying ? 'btn-disabled' : ''}`} onClick={handleVerifySubmit} disabled={isVerifying}>
                                                    {isVerifying ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-lock"></i>}
                                                    {isVerifying ? "Verifying..." : "Verify & Enter Department"}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}

                            </div>
                        )}

                    </main>
                </>
            );
        }
        

        const root = ReactDOM.createRoot(document.getElementById('react-admin-root'));
        root.render(<AdminDashboard />);
    </script>
</body>
</html>
