<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/ksk logo.jpeg" type="image/x-icon">
    <title>Department Workspace - KSK College</title>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- jsPDF for true PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Leaflet Map Library for Location UI -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- FIREBASE SETUP via ES Modules -->
    <script type="module" src="firebaseconfig.js"></script>

    <style>
        .btn-disabled {
            opacity: 0.7;
            cursor: not-allowed !important;
        }

        :root {
            --primary-red: #bb0f1c;
            --primary-red-hover: #9b0c16;
            --sidebar-width: 260px;
            --bg-color: #f4f7fb;
            --white: #ffffff;
            --text-dark: #0f172a;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background: linear-gradient(135deg, #fdfdfe 0%, #edf2f8 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Layout */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--white);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            padding: 32px 0;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 0 24px;
            margin-bottom: 40px;
        }

        .sidebar-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .sidebar-header p {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .nav-item i {
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        .nav-item:hover {
            background-color: #f8fafc;
            color: var(--text-dark);
        }

        .nav-item.active {
            background-color: #fff1f2;
            color: var(--primary-red);
            border-left-color: var(--primary-red);
        }

        .sidebar-footer {
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-start-class {
            background-color: var(--primary-red);
            color: var(--white);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn-start-class:hover {
            background-color: var(--primary-red-hover);
        }

        .footer-link {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer-link:hover {
            color: var(--text-dark);
        }

        /* Main Content Layout */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Header */
        .top-header {
            height: 70px;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: auto;
        }

        .profile-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--white);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .profile-img:hover {
            border-color: var(--primary-red);
        }

        /* Profile Dropdown Styles */
        .profile-dropdown {
            position: relative;
            display: flex;
            align-items: center;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 120%;
            background-color: var(--white);
            min-width: 220px;
            box-shadow: var(--shadow-md);
            border-radius: 10px;
            padding: 16px;
            z-index: 1000;
            text-align: center;
            border: 1px solid var(--border-light);
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-profile-img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            margin-bottom: 12px;
            object-fit: cover;
        }

        .dropdown-email {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            word-break: break-all;
        }

        .logout-btn {
            background-color: #fef2f2;
            color: var(--primary-red);
            border: 1px solid #fecaca;
            padding: 10px 16px;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background-color: var(--primary-red);
            color: var(--white);
        }

        /* Page Content */
        .page-content {
            padding: 20px 40px 40px;
        }

        .page-header {
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .page-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Current Department Badge */
        .active-dept-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #ecfdf5;
            color: #059669;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #a7f3d0;
        }

        .active-dept-badge span {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        /* Split Layout */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1.1fr 0.9fr;
            gap: 24px;
            align-items: stretch;
        }

        /* History Card Styles */
        .history-card {
            background: var(--white);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 620px;
            overflow-y: auto;
        }

        .history-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 12px;
            margin-bottom: 8px;
            position: sticky;
            top: -24px;
            background: var(--white);
            z-index: 10;
            margin-top: -8px;
            padding-top: 8px;
        }

        .history-item {
            background: #f8fafc;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .history-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .hist-course {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 2px;
        }

        .hist-dept {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .hist-date {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .hist-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .btn-hist-action {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--white);
            border: 1px solid var(--border-light);
            color: var(--text-main);
        }

        .btn-hist-action:hover {
            background: #f1f5f9;
            color: var(--primary-red);
            border-color: #cbd5e1;
        }

        /* Custom Scrollbar for History */
        .history-card::-webkit-scrollbar {
            width: 6px;
        }

        .history-card::-webkit-scrollbar-track {
            background: transparent;
        }

        .history-card::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        /* Left Column: Form Card */
        .form-card {
            background: var(--white);
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 12px;
            margin-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* Custom Select & Input */
        .custom-input {
            background-color: #f1f5f9;
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-dark);
            width: 100%;
            transition: all 0.2s;
            outline: none;
            appearance: none;
        }

        .custom-input:focus {
            background-color: var(--white);
            border-color: #cbd5e1;
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.05);
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        .btn-generate {
            background-color: #0f172a;
            color: var(--white);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: auto;
        }

        .btn-generate:hover {
            background-color: #1e293b;
        }

        /* Right Column: QR Preview Card */
        .qr-preview-container {
            background-color: var(--white);
            border-radius: 16px;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
            min-height: 500px;
        }

        .qr-preview-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: linear-gradient(to right, #f1f5f9 1px, transparent 1px), linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        .qr-card-inner {
            background: var(--white);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: var(--shadow-lg);
            z-index: 2;
            text-align: center;
            width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-image {
            width: 180px;
            height: 180px;
            margin-bottom: 32px;
            object-fit: contain;
        }

        .qr-course-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .qr-meta-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .qr-actions {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-download {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-dark);
        }

        .btn-download:hover {
            background: #f8fafc;
        }

        .btn-print {
            background: var(--primary-red);
            border: 1px solid var(--primary-red);
            color: var(--white);
        }

        .btn-print:hover {
            background: var(--primary-red-hover);
        }

        /* Map Modal Overlay Styles */
        .map-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.6);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            opacity: 0;
            animation: fadeIn 0.2s forwards;
        }

        .map-modal {
            background: var(--white);
            border-radius: 16px;
            padding: 32px;
            width: 90%;
            max-width: 600px;
            box-shadow: var(--shadow-lg);
            transform: scale(0.95);
            animation: scaleUp 0.2s forwards;
            display: flex;
            flex-direction: column;
        }

        .map-modal h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .map-modal p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .map-error-msg {
            background: #fff1f2;
            color: var(--primary-red);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            border: 1px solid #fecaca;
            font-weight: 500;
        }

        #leaflet-map-container {
            height: 320px;
            width: 100%;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid var(--border-light);
            z-index: 1;
        }

        .map-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes scaleUp {
            to {
                transform: scale(1);
            }
        }

        /* Class Management / Timetable Styles */
        .timetable-actions {
            display: flex;
            gap: 12px;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--border-light);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-main);
            transition: background 0.2s;
        }

        .btn-cancel:hover {
            background: #f8fafc;
        }

        .btn-save {
            background: var(--primary-red);
            color: var(--white);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-save:hover {
            background: var(--primary-red-hover);
        }

        .timetable-grid {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr) 280px;
            gap: 24px;
            align-items: start;
        }

        /* Timetable Context Panel */
        .context-panel {
            background: #f8fafc;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-light);
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .template-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .template-card {
            background: var(--white);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .template-card:hover {
            border-color: var(--primary-red);
            color: var(--primary-red);
            box-shadow: var(--shadow-sm);
        }

        .template-card i {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .template-card:hover i {
            color: var(--primary-red);
        }

        /* Timetable Schedule Entry */
        .schedule-panel {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .schedule-entry-card {
            background: var(--white);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            overflow: hidden;
        }

        .schedule-entry-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 16px;
            flex-wrap: wrap;
        }

        .day-tabs {
            display: flex;
            gap: 8px;
            margin-left: auto;
            overflow-x: auto;
        }

        .day-tab {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            white-space: nowrap;
        }

        .day-tab.active {
            background: #ffeef0;
            color: var(--primary-red);
        }

        .table-responsive-wrapper {
            width: 100%;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        .schedule-table th {
            text-align: left;
            padding: 0 12px 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .schedule-table td {
            padding: 8px;
        }

        .schedule-table input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-dark);
            transition: border-color 0.2s;
            outline: none;
        }

        .schedule-table input:focus {
            border-color: var(--primary-red);
        }

        .btn-delete-row {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 8px;
            transition: color 0.2s;
            width: 100%;
        }

        .btn-delete-row:hover {
            color: var(--primary-red);
        }

        .btn-add-row {
            background: #0f172a;
            color: var(--white);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 0 auto;
            transition: background 0.2s;
        }

        .btn-add-row:hover {
            background: var(--primary-red);
        }

        /* Timetable Preview */
        .timeline-preview-card {
            background: var(--white);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }

        .timeline-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .timeline-track {
            display: flex;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            background: #f8fafc;
            height: 80px;
        }

        .timeline-block {
            border-right: 1px solid #e2e8f0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: background 0.2s;
        }

        .timeline-block.filled-1 {
            background: #eff6ff;
            border-left: 3px solid #3b82f6;
        }

        .timeline-block.filled-2 {
            background: #f5f3ff;
            border-left: 3px solid #8b5cf6;
        }

        .timeline-block h5 {
            font-size: 0.85rem;
            color: var(--text-dark);

<body>

    <div id="react-workspace-root"></div>

    <script type="text/babel">
        // NEW: HTML5 Canvas Emoji Dominant Color Extractor
        const getEmojiDominantColor = (emojiStr) => {
            if (!emojiStr) return { bg: '#fffbeb', border: '#fde68a', text: '#92400e' };
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 50; canvas.height = 50;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 50, 50);
                ctx.font = '40px Arial';
                ctx.fillText(emojiStr, 5, 40);
                
                const data = ctx.getImageData(0, 0, 50, 50).data;
                let r = 0, g = 0, b = 0, count = 0;
                
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i] > 240 && data[i+1] > 240 && data[i+2] > 240) continue; // Ignore white bg
                    if (data[i] < 30 && data[i+1] < 30 && data[i+2] < 30) continue; // Ignore dark outlines
                    
                    r += data[i]; g += data[i+1]; b += data[i+2];
                    count++;
                }
                
                if (count === 0) return { bg: '#fffbeb', border: '#fde68a', text: '#92400e' }; 
                
                r = Math.floor(r / count); g = Math.floor(g / count); b = Math.floor(b / count);
                const darken = (val) => Math.floor(val * 0.45); // Safely darken the color for text readability
                
                return {
                    bg: `rgba(${r}, ${g}, ${b}, 0.15)`,
                    border: `rgba(${r}, ${g}, ${b}, 0.4)`,
                    text: `rgb(${darken(r)}, ${darken(g)}, ${darken(b)})`
                };
            } catch (e) {
                return { bg: '#fffbeb', border: '#fde68a', text: '#92400e' };
            }
        };

        function DepartmentWorkspace() {
            // Check context first: If no department was selected, kick back to admin.html
            const activeDeptContext = JSON.parse(localStorage.getItem('active_department'));
            if (!activeDeptContext) {
                window.location.href = 'admin.html';
            }

            // Navigation State (SPA Routing)
            const [activeView, setActiveView] = React.useState('class_management');

            // NEW: Campus Message Broadcast States
            const [isMsgModalOpen, setIsMsgModalOpen] = React.useState(false);
            const [msgStep, setMsgStep] = React.useState(1);
            const [msgFilters, setMsgFilters] = React.useState({ year: '', semester: '', batch: '' });
            const [msgPayload, setMsgPayload] = React.useState({ title: '', body: '', imageBase64: '' });
            const [isSendingMsg, setIsSendingMsg] = React.useState(false);

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setMsgPayload({ ...msgPayload, imageBase64: reader.result });
                    reader.readAsDataURL(file);
                }
            };

            const handleSendBroadcast = async () => {
                if (!msgPayload.title || !msgPayload.body) return alert("Title and Message are required!");
                setIsSendingMsg(true);
                try {
                    const alertDoc = {
                        department: activeDeptContext.title,
                        year: msgFilters.year,
                        semester: msgFilters.semester,
                        batch: msgFilters.batch,
                        title: msgPayload.title,
                        body: msgPayload.body,
                        image: msgPayload.imageBase64,
                        timestamp: new Date().toISOString(),
                        sender: adminProfile.name
                    };
                    
                    // FIX: Replaced unsupported addDoc with setDoc + generated unique ID
                    const docId = `alert_${Date.now()}`;
                    await window.firebaseAuth.setDoc(
                        window.firebaseAuth.doc(window.firebaseAuth.db, "campus_alerts", docId),
                        alertDoc
                    );
                    
                    setTimeout(() => {
                        setIsSendingMsg(false);
                        setIsMsgModalOpen(false);
                        setMsgStep(1);
                        setMsgPayload({ title: '', body: '', imageBase64: '' });
                        alert("Message Broadcasted Successfully!");
                    }, 1200); // Allow the SVG animation to play
                } catch (err) {
                    console.error("Broadcast failed:", err);
                    setIsSendingMsg(false);
                }
            };

            // Security State for Admin Access
            const [isAuthorized, setIsAuthorized] = React.useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = React.useState(false);
            const [isDropdownOpen, setIsDropdownOpen] = React.useState(false);
            const [adminProfile, setAdminProfile] = React.useState({ name: 'Admin', email: '', photoUrl: '' });

            // --- QR GENERATOR STATES ---
            const [formData, setFormData] = React.useState({
                department: activeDeptContext ? activeDeptContext.title : '',
                year: '2-year',
                semester: 'sem-3',
                course: '',
                room: 'CR-200',
                expiration: '15',
                latitude: '',
                longitude: ''
            });

            const [isMapModalOpen, setIsMapModalOpen] = React.useState(false);
            const [isFetchingLocation, setIsFetchingLocation] = React.useState(false); // NEW: Location Loading State
            const [mapError, setMapError] = React.useState('');
            const mapRef = React.useRef(null);
            const markerRef = React.useRef(null);
            const [qrUrl, setQrUrl] = React.useState(null);
            const [highResQrUrl, setHighResQrUrl] = React.useState(null);
            const [isGenerating, setIsGenerating] = React.useState(false);
            const [isDownloading, setIsDownloading] = React.useState(false);
            const [isPrinting, setIsPrinting] = React.useState(false);
            const [qrHistory, setQrHistory] = React.useState([]);

            // NEW: Fetch QR History from Firebase Database instead of LocalStorage
            React.useEffect(() => {
                if (activeView === 'qr_generator' && activeDeptContext && window.firebaseAuth) {
                    const fetchQrHistory = async () => {
                        try {
                            const qRef = window.firebaseAuth.collection(window.firebaseAuth.db, "qr_sessions");
                            const snapshot = await window.firebaseAuth.getDocs(qRef);
                            const history = [];
                            
                            snapshot.forEach(doc => {
                                const data = doc.data();
                                // Only pull codes generated for the currently active department
                                if (data.department === activeDeptContext.title) {
                                    history.push({ id: doc.id, ...data });
                                }
                            });
                            
                            // Sort chronologically (newest first) and keep the latest 50
                            history.sort((a, b) => b.createdAt - a.createdAt);
                            setQrHistory(history.slice(0, 50));
                        } catch (err) {
                            console.error("Error fetching QR history from database:", err);
                        }
                    };
                    fetchQrHistory();
                }
            }, [activeView, activeDeptContext]);

            // --- STUDENT REPORT STATES & FIREBASE FETCH ---
            const [cohortFilter, setCohortFilter] = React.useState({ year: '4th year', semester: 'semester-7', batch: '2023-2027', startDate: '', endDate: '' });
            const [rosterData, setRosterData] = React.useState([]);
            const [isFetchingRoster, setIsFetchingRoster] = React.useState(false);
            const [isExportingRoster, setIsExportingRoster] = React.useState(false); // NEW: Export Roster PDF state
            const [liveStudentCount, setLiveStudentCount] = React.useState(0);
            const [liveCohortAvg, setLiveCohortAvg] = React.useState(null); // NEW: State for cohort average
            const [isCounting, setIsCounting] = React.useState(false);

            // NEW: Live Preview Counter & Average Calculator (Zero-Refresh Polling)
            React.useEffect(() => {
                if (activeView === 'cohort_selection' && activeDeptContext && window.firebaseAuth) {
                    const calculatePreview = async () => {
                        setIsCounting(true);
                        try {
                            // 1. Fetch exact matching students
                            const usersRef = window.firebaseAuth.collection(window.firebaseAuth.db, "users");
                            const usersSnap = await window.firebaseAuth.getDocs(usersRef);
                            let count = 0;
                            const validStudents = [];
                            usersSnap.forEach(doc => {
                                const data = doc.data();
                                if (data.department === activeDeptContext.title && 
                                    data.year === cohortFilter.year && 
                                    data.semester === cohortFilter.semester && 
                                    data.batch === cohortFilter.batch) {
                                    count++;
                                    validStudents.push(data);
                                }
                            });
                            setLiveStudentCount(count);

                            // 2. If dates exist, calculate true average
                            if (cohortFilter.startDate && cohortFilter.endDate && count > 0) {
                                const [sY, sM, sD] = cohortFilter.startDate.split('-');
                                const startD = new Date(sY, sM - 1, sD, 0, 0, 0);
                                const [eY, eM, eD] = cohortFilter.endDate.split('-');
                                const endD = new Date(eY, eM - 1, eD, 23, 59, 59);

                                // Stop math if dates are invalid or future
                                const todayObj = new Date();

                            studentLogs.forEach(log => {
                                // Count standard P and manual OD overrides
                                if (log.status === 'P' || log.status === 'OD' || log.status === 'Present') {
                                    const logLocalTimeStr = log.scanVerifiedLocalTime || "";
                                    const dbLocalDateOnly = logLocalTimeStr.split(',')[0].trim();

                                        // Must strictly fall between start and end dates
                                        if (logTime >= sTime && logTime <= eTime) {
                                            const uniqueKey = `${dbLocalDateOnly}_${log.courseName}`;
                                            if (!countedDatePeriods.has(uniqueKey)) {
                                                countedDatePeriods.add(uniqueKey);
                                                attendedCount++;
                                            }
                                        }
                                    }
                                }

                                total: totalClassesHeld,
                                percentage: parseFloat(percentage)

                if (!time24) return '';
                const [h, m] = time24.split(':');
                const hours = parseInt(h, 10);
                const ampm = hours >= 12 ? 'PM' : 'AM';
                const hours12 = hours % 12 || 12;
                return `${hours12.toString().padStart(2, '0')}:${m} ${ampm}`;
            };

            const convertTo24Hour = (time12) => {
                if (!time12) return '';
                const parts = time12.split(' ');
                if (parts.length < 2) return time12; // Already 24h fallback
                let [hours, minutes] = parts[0].split(':');
                if (hours === '12') hours = '00';
                if (parts[1] === 'PM') hours = (parseInt(hours, 10) + 12).toString();
                return `${hours.padStart(2, '0')}:${minutes}`;

                                                const pCount = s.attendance.filter(a => a === 'P' || a === 'OD').length;

                                            <span></span> {activeDeptContext?.title || 'Workspace'} 
                                        </div>
                                        <div style={{ background: '#fef2f2', color: 'var(--primary-red)', padding: '8px 16px', borderRadius: '8px', fontWeight: 600, border: '1px solid #fecaca', fontSize: '0.9rem' }}>
                                            <i className="fa-solid fa-triangle-exclamation"></i> {absenteeList.length} Absentees Detected Today
                                        </div>
                                    </div>
                                </div>

                                <div className="schedule-entry-card" style={{ display: 'flex', flexDirection: 'column' }}>
                                    <div className="schedule-entry-header" style={{ marginBottom: '16px', paddingBottom: '12px' }}>
                                        <i className="fa-brands fa-whatsapp" style={{ fontSize: '1.5rem', color: '#25D366' }}></i>
                                        <div>
                                            <h3 style={{ fontSize: '1.1rem', fontWeight: 700, color: 'var(--text-dark)' }}>Dispatch Notifications</h3>
                                            <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '2px' }}>Target Context: {sheetFilters.year} &bull; {sheetFilters.semester} &bull; {sheetFilters.academicDate.split('-').reverse().join('/')}</p>
                                        </div>
                                    </div>

                                    <div className="att-table-wrapper" style={{ flex: 1, maxHeight: '600px', overflowY: 'auto' }}>
                                        <table className="att-table" style={{ minWidth: '100%' }}>
                                            <thead style={{ position: 'sticky', top: 0, background: 'var(--white)', zIndex: 10 }}>
                                                <tr>
                                                    <th style={{ width: '130px' }}>Roll No</th>
                                                    <th>Student Name</th>
                                                    <th>Missed Subjects</th>
                                                    <th style={{ width: '160px' }}>Parent Mobile</th>
                                                    <th style={{ width: '220px', textAlign: 'center' }}>Action</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {isFetchingAbsentees ? (
                                                    <tr>
                                                        <td colSpan="5" style={{ textAlign: 'center', padding: '40px', color: '#94a3b8' }}>
                                                            <i className="fa-solid fa-spinner fa-spin" style={{ fontSize: '2rem', marginBottom: '16px' }}></i><br/>Analyzing Attendance Records...
                                                        </td>
                                                    </tr>
                                                ) : absenteeList.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="5" style={{ textAlign: 'center', padding: '40px', color: '#10b981', fontWeight: 600 }}>
                                                            <i className="fa-regular fa-face-smile" style={{ fontSize: '2rem', marginBottom: '16px', color: '#10b981' }}></i><br/>Excellent! No absentees detected for this cohort today.
                                                        </td>
                                                    </tr>
                                                ) : (
                                                    absenteeList.map((student, idx) => (
                                                        <tr key={idx}>
                                                            <td>{student.rollNo}</td>
                                                            <td><span style={{ fontWeight: 600, color: 'var(--text-dark)' }}>{student.name}</span></td>
                                                            <td>
                                                                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
                                                                    {student.absentSubjects.map((sub, sIdx) => (
                                                                        <span key={sIdx} style={{ background: '#fff1f2', color: 'var(--primary-red)', padding: '2px 8px', borderRadius: '4px', fontSize: '0.75rem', fontWeight: 600, border: '1px solid #fecaca' }}>
                                                                            {sub}
                                                                        </span>
                                                                    ))}
                                                                </div>
                                                            </td>
                                                            <td>
                                                                {student.parentMobile ? (
                                                                    <span style={{ color: 'var(--text-main)', fontWeight: 500 }}><i className="fa-solid fa-phone" style={{ fontSize: '0.8rem', color: '#94a3b8', marginRight: '6px' }}></i> {student.parentMobile}</span>
                                                                ) : (
                                                                    <span style={{ color: '#f59e0b', fontSize: '0.8rem', fontWeight: 600 }}><i className="fa-solid fa-circle-exclamation"></i> Not Registered</span>
                                                                )}
                                                            </td>
                                                            <td style={{ textAlign: 'center' }}>
                                                                <button 
                                                                    onClick={() => handleSendWhatsApp(student)}
                                                                    style={{ background: student.parentMobile ? '#25D366' : '#e2e8f0', color: student.parentMobile ? 'white' : '#94a3b8', border: 'none', padding: '8px 16px', borderRadius: '6px', fontWeight: 600, cursor: student.parentMobile ? 'pointer' : 'not-allowed', display: 'inline-flex', alignItems: 'center', gap: '8px', transition: 'all 0.2s', boxShadow: student.parentMobile ? '0 4px 10px rgba(37, 211, 102, 0.2)' : 'none' }}
                                                                >
                                                                    <i className="fa-brands fa-whatsapp" style={{ fontSize: '1.1rem' }}></i> Send WhatsApp
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Map Modal */}
                        {isMapModalOpen && (
                            <div className="map-modal-overlay">
                                <div className="map-modal">
                                    <h3>Set Class Coordinates</h3><p>Allow location access to plot the classroom.</p>
                                    {mapError && <div className="map-error-msg">{mapError}</div>}
                                    
                                    <div style={{ position: 'relative' }}>
                                        <div id="leaflet-map-container"></div>
                                        
                                        {/* NEW: Translucent GPS Loading Overlay */}
                                        {isFetchingLocation && (
                                            <div style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', background: 'rgba(255,255,255,0.8)', zIndex: 1000, display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', borderRadius: '12px' }}>
                                                <i className="fa-solid fa-satellite-dish fa-beat" style={{ fontSize: '2.5rem', color: 'var(--primary-red)', marginBottom: '12px' }}></i>
                                                <span style={{ fontWeight: 700, color: 'var(--text-dark)', fontSize: '1.1rem' }}>Acquiring GPS Signal...</span>
                                                <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '4px' }}>Please wait for high accuracy lock</span>
                                            </div>
                                        )}
                                    </div>

                                    <div className="map-modal-actions">
                                        <button className="btn-action btn-download" onClick={() => setIsMapModalOpen(false)}>Cancel</button>
                                        <button 
                                            className={`btn-action btn-download ${isFetchingLocation ? 'btn-disabled' : ''}`} 
                                            disabled={isFetchingLocation} 
                                            onClick={handleDetectLocation}
                                        >
                                            {isFetchingLocation ? 'Locating...' : 'Recalibrate'}
                                        </button>
                                        <button className="btn-action btn-print" onClick={() => setIsMapModalOpen(false)}>Confirm</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* NEW: Export PDF / Excel Modal */}
                        {isExportModalOpen && (
                            <div className="map-modal-overlay">
                                <div className="map-modal" style={{ maxWidth: '500px' }}>
                                    <h3 style={{ marginBottom: '10px' }}><i className="fa-solid fa-file-export" style={{ color: 'var(--primary-red)', marginRight: '8px' }}></i> Export Attendance Report</h3>
                                    <p>Select a date range to generate a comprehensive, print-ready PDF/Excel report for the target cohort.</p>

                                    <div className="form-group" style={{ marginBottom: '16px', marginTop: '10px' }}>
                                        <label>Target Department & Cohort</label>
                                        <input type="text" className="custom-input" value={`${activeDeptContext?.title} • ${sheetFilters.year} • ${sheetFilters.semester}`} disabled style={{ backgroundColor: '#f8fafc', color: '#64748b', fontWeight: 600 }} />
                                    </div>

                                    <div className="input-row" style={{ marginBottom: '16px' }}>
                                        <div className="form-group">
                                            <label>Start Date</label>
                                            <input type="date" className="custom-input" value={exportFilters.startDate} onChange={(e) => setExportFilters({...exportFilters, startDate: e.target.value})} />
                                        </div>
                                        <div className="form-group">
                                            <label>End Date</label>
                                            <input type="date" className="custom-input" value={exportFilters.endDate} onChange={(e) => setExportFilters({...exportFilters, endDate: e.target.value})} />
                                        </div>
                                    </div>

                                    <div className="map-modal-actions" style={{ marginTop: '24px' }}>
                                        <button className="btn-action btn-download" onClick={() => setIsExportModalOpen(false)}>Cancel</button>
                                        <button 
                                            className={`btn-action btn-print ${isExporting ? 'btn-disabled' : ''}`} 
                                            onClick={handleGenerateReport} 
                                            disabled={isExporting}
                                            style={{ display: 'flex', gap: '8px' }}
                                        >
                                            {isExporting ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-print"></i>}
                                            {isExporting ? 'Compiling Matrix...' : 'Generate Document'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* NEW: Campus Message Modal */}
                        {isMsgModalOpen && (
                            <div className="msg-modal-overlay">
                                <div className="msg-modal">
                                    <div className="msg-header">
                                        <h3 className="msg-title"><i className="fa-solid fa-tower-broadcast" style={{color: 'var(--primary-red)'}}></i> Broadcast Message</h3>
                                        <button className="btn-close-modal" onClick={() => setIsMsgModalOpen(false)}><i className="fa-solid fa-xmark"></i></button>
                                    </div>
                                    
                                    <div className="msg-step-indicator">
                                        <div className={`msg-step-dot ${msgStep >= 1 ? 'active' : ''}`}></div>
                                        <div className={`msg-step-dot ${msgStep >= 2 ? 'active' : ''}`}></div>
                                    </div>

                                    {msgStep === 1 ? (
                                        <div className="msg-step-1">
                                            <p style={{marginBottom: '16px', color: 'var(--text-muted)', fontSize: '0.9rem'}}>Select the target audience for this broadcast.</p>
                                            <div className="input-row" style={{marginBottom: '16px'}}>
                                                <div className="form-group">
                                                    <label>Department</label>
                                                    <input type="text" className="custom-input" value={activeDeptContext?.title} disabled style={{background: '#f1f5f9'}}/>
                                                </div>
                                                <div className="form-group">
                                                    <label>Batch</label>
                                                    <select className="custom-input" value={msgFilters.batch} onChange={(e) => setMsgFilters({...msgFilters, batch: e.target.value})} required>
                                                        <option value="">Select Batch</option>
                                                        <option value="2023-2027">2023-2027</option>
                                                        <option value="2024-2028">2024-2028</option>
                                                        <option value="2025-2029">2025-2029</option>
                                                        <option value="2026-2030">2026-2030</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="input-row" style={{marginBottom: '24px'}}>
                                                <div className="form-group">
                                                    <label>Year</label>
                                                    <select className="custom-input" value={msgFilters.year} onChange={(e) => setMsgFilters({...msgFilters, year: e.target.value})} required>
                                                        <option value="">Select Year</option>
                                                        <option value="1st year">1st year</option>
                                                        <option value="2nd year">2nd year</option>
                                                        <option value="3rd year">3rd year</option>
                                                        <option value="4th year">4th year</option>
                                                    </select>
                                                </div>
                                                <div className="form-group">
                                                    <label>Semester</label>
                                                    <select className="custom-input" value={msgFilters.semester} onChange={(e) => setMsgFilters({...msgFilters, semester: e.target.value})} required>
                                                        <option value="">Select Semester</option>
                                                        <option value="semester-1">semester-1</option>
                                                        <option value="semester-2">semester-2</option>
                                                        <option value="semester-3">semester-3</option>
                                                        <option value="semester-4">semester-4</option>
                                                        <option value="semester-5">semester-5</option>
                                                        <option value="semester-6">semester-6</option>
                                                        <option value="semester-7">semester-7</option>
                                                        <option value="semester-8">semester-8</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <button className="btn-save" style={{width: '100%', justifyContent: 'center'}} onClick={() => {
                                                if(!msgFilters.year || !msgFilters.semester || !msgFilters.batch) return alert("Please select all filters");
                                                setMsgStep(2);
                                            }}>Confirm Target Audience <i className="fa-solid fa-arrow-right"></i></button>
                                        </div>
                                    ) : (
                                        <div className="msg-step-2">
                                            <div className="form-group" style={{marginBottom: '16px'}}>
                                                <label>Cover Image (Optional)</label>
                                                <label className="msg-img-upload">
                                                    <input type="file" accept="image/*" style={{display: 'none'}} onChange={handleImageUpload} />
                                                    {msgPayload.imageBase64 ? (
                                                        <img src={msgPayload.imageBase64} className="msg-img-preview" />
                                                    ) : (
                                                        <div style={{color: 'var(--text-muted)'}}>
                                                            <i className="fa-solid fa-cloud-arrow-up" style={{fontSize: '2rem', marginBottom: '8px'}}></i>
                                                            <p>Click to upload landscape image</p>
                                                        </div>
                                                    )}
                                                </label>
                                            </div>
                                            <div className="form-group" style={{marginBottom: '16px'}}>
                                                <label>Message Title</label>
                                                <input type="text" className="custom-input" placeholder="e.g. End Semester Exam Schedule" value={msgPayload.title} onChange={(e) => setMsgPayload({...msgPayload, title: e.target.value})} />
                                            </div>
                                            <div className="form-group" style={{marginBottom: '24px'}}>
                                                <label>Message Details</label>
                                                <textarea className="custom-input" rows="4" placeholder="Enter full message details..." value={msgPayload.body} onChange={(e) => setMsgPayload({...msgPayload, body: e.target.value})}></textarea>
                                            </div>
                                            <div style={{display: 'flex', gap: '12px'}}>
                                                <button className="btn-cancel" style={{flex: 1}} onClick={() => setMsgStep(1)}>Back</button>
                                                <button className={`btn-save ${isSendingMsg ? 'btn-disabled' : ''}`} style={{flex: 2, justifyContent: 'center'}} onClick={handleSendBroadcast} disabled={isSendingMsg}>
                                                    <svg className="send-svg-icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                                                    {isSendingMsg ? " Broadcasting..." : " Send Notification"}
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                    </main>

                    {/* NEW: Bottom Mobile Nav for Department Admin */}
                    <nav className="bottom-mobile-nav">
                        <a href="#" className={activeView === 'class_management' ? 'active' : ''} onClick={(e) => { e.preventDefault(); setActiveView('class_management'); }}>
                            <i className="fa-regular fa-calendar"></i>
                            <span>Schedule</span>
                        </a>
                        <a href="#" className={activeView === 'qr_generator' ? 'active' : ''} onClick={(e) => { e.preventDefault(); setActiveView('qr_generator'); }}>
                            <i className="fa-solid fa-qrcode"></i>
                            <span>QR Gen</span>
                        </a>
                        <a href="#" className={activeView === 'attendance_sheet' ? 'active' : ''} onClick={(e) => { e.preventDefault(); setActiveView('attendance_sheet'); }}>
                            <i className="fa-solid fa-clipboard-user"></i>
                            <span>Register</span>
                        </a>
                        <a href="#" className={activeView === 'cohort_selection' || activeView === 'student_report' || activeView === 'absent_alerts' ? 'active' : ''} onClick={(e) => { e.preventDefault(); setActiveView('cohort_selection'); }}>
                            <i className="fa-solid fa-chart-pie"></i>
                            <span>Report</span>
                        </a>
                        {/* NEW: Mobile Access to Parent Contacts */}
                        <a href="#" className={activeView === 'parent_contacts' ? 'active' : ''} onClick={(e) => { e.preventDefault(); setActiveView('parent_contacts'); }}>
                            <i className="fa-solid fa-address-book"></i>
                            <span>Contacts</span>
                        </a>
                    </nav>
                </>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('react-workspace-root'));
        root.render(<DepartmentWorkspace />);
    </script>
</body>

</html>
