<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/ksk logo.jpeg" type="image/x-icon">
    <title>Page Not Found - AttendancePro</title>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-red: #bb0f1c;
            --primary-red-hover: #9b0c16;
            --text-dark: #0f172a;
            --text-main: #334155;
            --text-muted: #64748b;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4fd 0%, #e1e9f6 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-card {
            background: var(--white);
            padding: 60px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 480px;
            width: 100%;
            border-top: 6px solid var(--primary-red);
        }

        .error-icon {
            font-size: 3.5rem;
            color: var(--primary-red);
            margin-bottom: 24px;
            opacity: 0.9;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1;
            margin-bottom: 16px;
            letter-spacing: -2px;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 16px;
        }

        .error-message {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--primary-red);
            color: var(--white);
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-home:hover {
            background: var(--primary-red-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(187, 15, 28, 0.2);
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .error-card { padding: 40px 24px; }
            .error-code { font-size: 5rem; }
        }
    </style>
</head>
<body>

    <div class="error-card">
        <i class="fa-solid fa-triangle-exclamation error-icon"></i>
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">The page you are looking for doesn't exist, has been moved, or is temporarily unavailable.</p> 
    </div>

</body>
</html>
